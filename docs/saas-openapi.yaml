openapi: 3.0.3
info:
  title: Champion SaaS Customer API
  description: >
    Server-to-server HTTP bridge between the Champion website and the
    authoritative Go SaaS repositories. See docs/SAAS_API.md for the full
    narrative handoff (auth model, acting-user contract, examples, tenant
    scoping). This file is a machine-readable companion to that document,
    not a replacement for it.
  version: "1.0.0"
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://dayzkillfeedbot-production.up.railway.app
        description: CHAMPION_SAAS_API_URL

security:
  - serviceAuth: []

components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      description: >
        Authorization: Bearer <CHAMPION_SAAS_API_SECRET> - the same value as
        the bot's WEBSITE_API_SECRET. Server-side only; never expose to
        browser code.
  parameters:
    ActingUser:
      name: X-Champion-Acting-User
      in: header
      required: true
      description: >
        The Discord user ID of the person acting on this request. Must have
        been synced at least once via POST /api/saas/users/sync. Not
        required on that one route.
      schema:
        type: string
    organizationID:
      name: organizationID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    embedRouteKey:
      name: routeKey
      in: path
      required: true
      description: A fixed channel-route key (see EmbedRouteKey); anything else is 400.
      schema: { $ref: "#/components/schemas/EmbedRouteKey" }
    installationID:
      name: installationID
      in: path
      required: true
      schema:
        type: integer
        format: int64

    factionID:
      name: factionID
      in: path
      required: true
      description: A Faction Hub faction id within this organization and installation; another tenant's id is 404.
      schema: { type: integer, format: int64 }
    factionApplicationID:
      name: applicationID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    factionMemberID:
      name: memberID
      in: path
      required: true
      description: The membership id (FactionMember.id), not the user id.
      schema: { type: integer, format: int64 }
    factionLimit:
      name: limit
      in: query
      required: false
      description: Page size (default 25, maximum 100; larger values are clamped, 0 or non-numeric is 400).
      schema: { type: integer, minimum: 1 }
    factionCursor:
      name: cursor
      in: query
      required: false
      description: Opaque; pass the previous page's nextCursor. Invalid is 400.
      schema: { type: string }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INVALID_REQUEST
                - DISCORD_UNAVAILABLE
                - INSTALLATION_NOT_VERIFIED
                - INTERNAL_ERROR
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - UNSUPPORTED_MEDIA_TYPE
                - LEADERSHIP_TRANSFER_REQUIRED
            message:
              type: string

    UserSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        discordUserId: { type: string }
        discordUsername: { type: string }
        discordGlobalName: { type: string }
        avatar: { type: string }

    UserSyncRequest:
      type: object
      required: [discord_user_id, discord_username]
      properties:
        discord_user_id: { type: string }
        discord_username: { type: string }
        discord_global_name: { type: string }
        avatar: { type: string }

    OrganizationSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }

    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }

    SubscriptionSummary:
      type: object
      properties:
        plan: { type: string }
        status: { type: string, enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED, SUSPENDED, INACTIVE] }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }

    SetupProgress:
      type: object
      properties:
        currentStep: { type: string, enum: [DISCORD, NITRADO, SERVER, CHANNELS, VALIDATION, COMPLETE] }
        discordCompleted: { type: boolean }
        nitradoCompleted: { type: boolean }
        serverSelected: { type: boolean }
        channelsCompleted: { type: boolean }
        validationCompleted: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }

    SetupProgressPatchRequest:
      type: object
      description: Every field optional - true PATCH semantics, only present fields change.
      properties:
        currentStep: { type: string, enum: [DISCORD, NITRADO, SERVER, CHANNELS, VALIDATION, COMPLETE] }
        discordCompleted: { type: boolean }
        nitradoCompleted: { type: boolean }
        serverSelected: { type: boolean }
        channelsCompleted: { type: boolean }
        validationCompleted: { type: boolean }

    DiscordGuildConnectionSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        guildName: { type: string }
        guildIcon: { type: string }
        botInstalled: { type: boolean }
        permissionsVerified: { type: boolean }
        connectedAt: { type: string, format: date-time }

    DayZServerSummary:
      type: object
      description: Mirrors DayZServerSelection so the website can hydrate the selected DayZ server directly from InstallationSummary.dayzServer after a refresh, without re-selecting it.
      properties:
        id: { type: integer, format: int64 }
        serviceId: { type: integer, format: int64 }
        displayName: { type: string }
        game: { type: string }
        platform: { $ref: "#/components/schemas/ConsolePlatform" }
        status: { type: string, enum: [ONLINE, OFFLINE] }

    InstallationSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status:
          type: string
          enum: [NOT_STARTED, DISCORD_CONNECTED, NITRADO_CONNECTED, CONFIGURING, READY, DEGRADED, DISCONNECTED, SUSPENDED]
        plan: { type: string }
        health: { type: string, enum: [SETTING_UP, HEALTHY, DEGRADED, OFFLINE] }
        setupProgress:
          allOf: [{ $ref: "#/components/schemas/SetupProgress" }]
          nullable: true
        discordConnection:
          allOf: [{ $ref: "#/components/schemas/DiscordGuildConnectionSummary" }]
          nullable: true
        dayzServer:
          allOf: [{ $ref: "#/components/schemas/DayZServerSummary" }]
          nullable: true
        createdAt: { type: string, format: date-time }
        setupCompletedAt: { type: string, format: date-time, nullable: true }
        lastHealthCheckAt: { type: string, format: date-time, nullable: true }

    CreateInstallationRequest:
      type: object
      required: [discordGuildConnectionId]
      properties:
        discordGuildConnectionId: { type: integer, format: int64 }

    DashboardSummary:
      type: object
      properties:
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        subscription:
          allOf: [{ $ref: "#/components/schemas/SubscriptionSummary" }]
          nullable: true
        installations:
          type: array
          items: { $ref: "#/components/schemas/InstallationSummary" }

    DiscordGuildCandidate:
      type: object
      required: [discordGuildId]
      properties:
        discordGuildId: { type: string }
        guildName: { type: string }
        guildIcon: { type: string }
        permissions:
          type: string
          description: Raw Discord permission bitfield for this user in this guild, as a decimal string.

    EligibleGuildsRequest:
      type: object
      properties:
        guilds:
          type: array
          items: { $ref: "#/components/schemas/DiscordGuildCandidate" }

    DiscordGuildSummary:
      type: object
      properties:
        discordGuildId: { type: string }
        guildName: { type: string }
        guildIcon: { type: string }
        eligible: { type: boolean }
        botInstalled: { type: boolean }

    ConnectGuildRequest:
      type: object
      required: [discordGuildId, permissions]
      properties:
        discordGuildId: { type: string }
        guildName: { type: string }
        guildIcon: { type: string }
        permissions: { type: string }

    DiscordInstallationVerification:
      type: object
      properties:
        installed: { type: boolean }
        guildReachable: { type: boolean }
        verifiedAt: { type: string, format: date-time }

    VerifyPermissionsRequest:
      type: object
      required: [channelId]
      properties:
        channelId: { type: string }

    CapabilityCheck:
      type: object
      properties:
        capability: { type: string, enum: ["View Channel", "Send Messages", "Embed Links", "Read Message History"] }
        result: { type: string, enum: [PASS, WARNING, FAIL] }

    DiscordPermissionVerification:
      type: object
      properties:
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/CapabilityCheck" }
        overallPass: { type: boolean }

    NitradoConnectRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Customer Nitrado account token. Never echoed back, logged, or stored in plaintext.

    NitradoConnectResponse:
      type: object
      properties:
        connected: { type: boolean }
        servicesFound:
          type: integer
          description: Count of supported (PlayStation + Xbox) DayZ console services only, not the account's raw total service count.

    ConsolePlatform:
      type: string
      enum: [PLAYSTATION, XBOX]
      description: Stable, persistence-safe platform identifier. The website renders its own friendly label ("PlayStation"/"Xbox") - never persist or match against a display label.

    NitradoServiceSummary:
      type: object
      properties:
        serviceId: { type: integer, format: int64 }
        name: { type: string }
        game: { type: string, description: 'Always "DayZ" - only DayZ services are ever returned.' }
        platform: { $ref: "#/components/schemas/ConsolePlatform" }
        status: { type: string, enum: [ONLINE, OFFLINE] }

    SelectDayZServerRequest:
      type: object
      required: [serviceId]
      properties:
        serviceId: { type: integer, format: int64 }

    DayZServerSelection:
      type: object
      properties:
        id: { type: integer, format: int64, description: The game_servers row ID. }
        serviceId: { type: integer, format: int64 }
        displayName: { type: string }
        game: { type: string }
        platform: { $ref: "#/components/schemas/ConsolePlatform" }
        status: { type: string, enum: [ONLINE, OFFLINE] }

    SelectDayZServerResponse:
      type: object
      description: >
        installationId is the RESOLVED installation and may differ from the
        {installationID} in the request path: if the selected Discord guild
        + DayZ server pair is already owned by a different existing
        installation in the same organization, that installation is reused
        (reusedInstallation=true) instead of creating a duplicate or
        conflicting with UNIQUE(discord_guild_connection_id, game_server_id).
      properties:
        server: { $ref: "#/components/schemas/DayZServerSelection" }
        installationId: { type: integer, format: int64 }
        reusedInstallation: { type: boolean }

    DayZServerValidation:
      type: object
      properties:
        reachable: { type: boolean }
        supported: { type: boolean }
        platform:
          allOf: [{ $ref: "#/components/schemas/ConsolePlatform" }]
          nullable: true
        message: { type: string }

    DiscordChannelType:
      type: string
      enum: [TEXT, ANNOUNCEMENT]
      description: Stable backend enum - never Discord's raw channel type integer.

    DiscordChannelSummary:
      type: object
      properties:
        id: { type: string, description: Discord channel snowflake. }
        name: { type: string }
        type: { $ref: "#/components/schemas/DiscordChannelType" }
        position: { type: integer }
        canSend:
          type: boolean
          description: Safe, best-effort hint only - not a substitute for POST .../discord/verify-permissions.

    InstallationChannelSettings:
      type: object
      description: Empty string means "not configured yet." The same channel ID may serve multiple purposes.
      properties:
        killfeedChannelId: { type: string, description: Required when saving via PUT. }
        leaderboardChannelId: { type: string }
        playerStatusChannelId: { type: string }
        adminLogChannelId: { type: string }

    ChannelCategorySummary:
      type: object
      properties:
        id: { type: string, description: Discord category channel snowflake. }
        name: { type: string }
        key:
          type: string
          enum: [LIVE, HUB, STAFF]
          description: Which Channel System V2 category this is (auto-setup responses only).

    ChannelRouteKey:
      type: string
      enum:
        [
          KILLFEED, PVE_FEED, LINK_GAMERTAG, STATS_LEADERBOARDS, AUTO_LEADERBOARD,
          HITFEED, BOUNTY, BOUNTY_TRACKING, HEATMAPS, ECONOMY, SHOP,
          CONNECTIONS, BUILD_FEED, ADMIN_ALERTS, ADMIN_LOGS, SERVER_STATUS, ONLINE_COUNTER,
        ]
      description: Stable backend feature identifier - never a display name. Several routes share one Discord channel; see docs/SAAS_API.md's "Channel routing" section for the layout and each route's producer.

    ChannelRouteInfo:
      type: object
      properties:
        channelId: { type: string, description: Discord channel snowflake. }
        channelName:
          type: string
          nullable: true
          description: Best-effort live lookup - omitted if the channel was deleted in Discord. channelId is always accurate regardless.
        managedByChampion:
          type: boolean
          description: True only for a channel Champion itself created/reused via one-click auto-setup; false once a customer explicitly points the route at a channel.

    EmbedRouteKey:
      type: string
      description: A fixed channel-route key (never an arbitrary string).
      enum: [KILLFEED, PVE_FEED, LINK_GAMERTAG, STATS_LEADERBOARDS, AUTO_LEADERBOARD, HITFEED, BOUNTY, BOUNTY_TRACKING, HEATMAPS, ECONOMY, SHOP, CONNECTIONS, BUILD_FEED, ADMIN_ALERTS, ADMIN_LOGS]
    VariableDefinition:
      type: object
      description: Backend-owned metadata for one approved template variable (Embed Designer V2.1).
      properties:
        name: { type: string }
        label: { type: string }
        description: { type: string }
        category: { type: string, enum: [Players, Combat, Killer Stats, Victim Stats, Head To Head, Streaks, Event Story, Bounty, Competitive, Economy, Activity, Server] }
        example: { type: string }
        optional: { type: boolean }
        availability: { type: string }
        format: { type: string, enum: [text, integer, decimal, distance, label, points, timestamp] }
        source: { type: string }

    EmbedDraftRequest:
      type: object
      additionalProperties: false
      required: [template]
      properties:
        template: { $ref: "#/components/schemas/EmbedTemplate" }
        variables:
          type: object
          description: Sample values, only the route's approved variables (max 32, 512 chars each). Treated like live player data.
          additionalProperties: { type: string }

    EmbedDTO:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        color: { type: integer }
        author: { type: object, nullable: true, properties: { name: { type: string }, iconUrl: { type: string } } }
        thumbnail: { type: object, nullable: true, properties: { url: { type: string } } }
        image: { type: object, nullable: true, properties: { url: { type: string } } }
        footer: { type: object, nullable: true, properties: { text: { type: string }, iconUrl: { type: string } } }
        timestamp: { type: string }
        fields:
          type: array
          items: { type: object, properties: { name: { type: string }, value: { type: string }, inline: { type: boolean } } }

    EmbedDestination:
      type: object
      properties:
        configured: { type: boolean }
        channelId: { type: string }
        channelName: { type: string }
        reachable: { type: boolean }
        canView: { type: boolean }
        canSend: { type: boolean }
        canEmbed: { type: boolean }
        canReadHistory: { type: boolean }
        missing: { type: array, items: { type: string } }

    EmbedPreviewResponse:
      type: object
      properties:
        routeKey: { type: string }
        runtimeRendering: { type: string, enum: [ENABLED, NOT_ENABLED] }
        customRenderingSupported: { type: boolean }
        renderable: { type: boolean }
        reason: { type: string, enum: [CUSTOM_TEMPLATE_DISABLED, TEMPLATE_PRODUCED_NO_CONTENT], nullable: true }
        embed: { allOf: [{ $ref: "#/components/schemas/EmbedDTO" }], nullable: true }
        metrics: { type: object, properties: { fieldCount: { type: integer }, totalText: { type: integer } } }
        warnings: { type: array, items: { type: string } }
        destination: { allOf: [{ $ref: "#/components/schemas/EmbedDestination" }], nullable: true }

    EmbedTestResponse:
      type: object
      properties:
        sent: { type: boolean }
        routeKey: { type: string }
        runtimeRendering: { type: string, enum: [ENABLED, NOT_ENABLED] }
        channel: { type: object, properties: { id: { type: string }, name: { type: string } } }
        messageId: { type: string }
        sentAt: { type: string, format: date-time }

    EmbedTemplate:
      type: object
      description: >
        The website's Phase 1 EmbedTemplate. A fixed typed structure - unknown keys are
        rejected. Text uses only the approved {{variables}} of the route; every other
        brace is reserved. The server sets version=1.
      required: [color]
      properties:
        version: { type: integer, readOnly: true }
        routeKey: { $ref: "#/components/schemas/EmbedRouteKey" }
        enabled: { type: boolean }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: "#D4AF37" }
        title:
          type: object
          properties: { enabled: { type: boolean }, template: { type: string, maxLength: 256 } }
        description:
          type: object
          properties: { enabled: { type: boolean }, template: { type: string, maxLength: 4096 } }
        author:
          type: object
          properties: { enabled: { type: boolean }, name: { type: string, maxLength: 256 }, iconUrl: { type: string, maxLength: 2048, description: http(s) only } }
        thumbnail:
          type: object
          properties: { enabled: { type: boolean }, url: { type: string, maxLength: 2048, description: http(s) only; required when enabled } }
        image:
          type: object
          properties: { enabled: { type: boolean }, url: { type: string, maxLength: 2048, description: http(s) only; required when enabled } }
        footer:
          type: object
          properties: { enabled: { type: boolean }, text: { type: string, maxLength: 2048 }, iconUrl: { type: string, maxLength: 2048, description: http(s) only } }
        timestamp: { type: boolean }
        fields:
          type: array
          maxItems: 25
          items:
            type: object
            properties:
              key: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
              label: { type: string, maxLength: 256 }
              enabled: { type: boolean }
              template: { type: string, maxLength: 1024 }
              inline: { type: boolean }
              order: { type: integer, minimum: 0, maximum: 10000 }
    EmbedTemplateResponse:
      type: object
      properties:
        routeKey: { $ref: "#/components/schemas/EmbedRouteKey" }
        customized: { type: boolean }
        template: { nullable: true, allOf: [ { $ref: "#/components/schemas/EmbedTemplate" } ] }
        variables: { type: array, items: { type: string }, description: Approved placeholders for this route. }
        variableDefinitions: { type: array, items: { $ref: "#/components/schemas/VariableDefinition" }, description: Metadata for each approved variable (V2.1). }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        runtimeRendering: { type: string, enum: [ENABLED, NOT_ENABLED], description: "ENABLED only when CHAMPION_CUSTOM_EMBEDS_ENABLED is on and the route has a runtime publisher that renders templates." }
    EmbedTemplateListResponse:
      type: object
      properties:
        installationId: { type: integer, format: int64 }
        templates: { type: array, items: { $ref: "#/components/schemas/EmbedTemplateResponse" } }
        customizedRoutes: { type: array, items: { $ref: "#/components/schemas/EmbedRouteKey" } }
        variables: { type: object, additionalProperties: { type: array, items: { type: string } } }
        variableDefinitions: { type: object, additionalProperties: { type: array, items: { $ref: "#/components/schemas/VariableDefinition" } } }
        runtimeRoutes: { type: array, items: { $ref: "#/components/schemas/EmbedRouteKey" }, description: Routes whose publishers render templates (independent of the flag). }
        limits:
          type: object
          properties:
            title: { type: integer }
            description: { type: integer }
            fields: { type: integer }
            fieldLabel: { type: integer }
            fieldValue: { type: integer }
            footerText: { type: integer }
            authorName: { type: integer }
            totalText: { type: integer }
        runtimeRendering: { type: string, enum: [ENABLED, NOT_ENABLED], description: "ENABLED only when CHAMPION_CUSTOM_EMBEDS_ENABLED is on and the route has a runtime publisher that renders templates." }
    ChannelRoutesResponse:
      type: object
      description: A route_key absent from routes means it isn't configured - never a placeholder empty entry.
      properties:
        routes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ChannelRouteInfo" }

    SaveChannelRoutesRequest:
      type: object
      required: [routes]
      description: >
        A partial merge keyed by route_key - never requires every route. A
        key with a non-empty channel ID upserts that route
        (managedByChampion becomes false). A key with an empty string
        explicitly disables/removes that route. An absent key is left
        untouched.
      properties:
        routes:
          type: object
          additionalProperties: { type: string }

    AutoSetupChannelsRequest:
      type: object
      properties:
        force:
          type: boolean
          description: Explicitly override existing customer-owned routing (legacy four-field or the new routes table) and restore Champion's defaults. Defaults to false.

    AutoSetupChannelsResponse:
      type: object
      description: >
        configured=false with a reason is a safe, expected outcome the
        website must branch on directly - never the {"error":...} envelope,
        since none of MISSING_MANAGE_CHANNELS, CUSTOM_CONFIGURATION_EXISTS or
        KILLFEED_UNAVAILABLE is a failure to retry blindly.
      properties:
        configured: { type: boolean }
        reason:
          type: string
          enum: [MISSING_MANAGE_CHANNELS, CUSTOM_CONFIGURATION_EXISTS, KILLFEED_UNAVAILABLE]
          nullable: true
        category:
          allOf: [{ $ref: "#/components/schemas/ChannelCategorySummary" }]
          nullable: true
          description: The LIVE category.
        categories:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/ChannelCategorySummary" }
        routes:
          type: object
          nullable: true
          description: Every mapped route, present only when configured=true. Routes of destinations skipped for lack of a working producer are absent.
          additionalProperties: { $ref: "#/components/schemas/ChannelRouteInfo" }
        destinations:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/ChannelDestinationReport" }
        retirable:
          type: array
          nullable: true
          description: Champion-managed channels/categories no route uses any more. Only the explicit, confirmed cleanup endpoint deletes them.
          items: { $ref: "#/components/schemas/RetirableChannel" }
        summary:
          allOf: [{ $ref: "#/components/schemas/LayoutSummary" }]
          nullable: true

    ChannelHealth:
      type: string
      enum: [ACTIVE, DISABLED, NOT_REQUIRED, BLOCKED, BROKEN]

    ChannelDestinationReport:
      type: object
      properties:
        key: { type: string, description: "COMBAT_FEED, HITFEED, BOUNTIES, CONNECTIONS, HEATMAPS, SERVER_STATUS, LEADERBOARDS, PLAYER_LINK, ECONOMY, ONLINE_COUNTER or ADMIN_LOGS." }
        voice: { type: boolean, description: "The online-players voice counter (no messages; its name is its content)." }
        label: { type: string }
        category: { type: string, enum: [LIVE, HUB, STAFF] }
        channelId: { type: string, nullable: true, description: Absent when the destination was skipped. }
        channelName: { type: string }
        health: { $ref: "#/components/schemas/ChannelHealth" }
        detail: { type: string, nullable: true }
        created: { type: boolean }
        starterSent: { type: boolean, description: One starter card was posted because the channel had no Champion content. }
        routes:
          type: array
          items:
            type: object
            properties:
              routeKey: { $ref: "#/components/schemas/ChannelRouteKey" }
              health: { $ref: "#/components/schemas/ChannelHealth" }
              detail: { type: string, nullable: true, description: "e.g. NOT_YET_PRODUCING_EVENTS, SOURCE_BLOCKED" }
        checks:
          type: object
          nullable: true
          properties:
            channelExists: { type: boolean }
            routeMapped: { type: boolean }
            producerConnected: { type: boolean }
            botCanSend: { type: boolean }
            visibleContent: { type: boolean }

    RetirableChannel:
      type: object
      properties:
        channelId: { type: string }
        channelName: { type: string, nullable: true }
        kind: { type: string, enum: [CHANNEL, CATEGORY] }
        source: { type: string, enum: [ROUTE, LEGACY_SETUP] }
        formerRoutes: { type: array, nullable: true, items: { type: string } }
        managedByChampion: { type: boolean, description: Always true - customer channels are never listed. }

    LayoutSummary:
      type: object
      properties:
        created: { type: array, nullable: true, items: { type: string } }
        reused: { type: array, nullable: true, items: { type: string } }
        remapped: { type: array, nullable: true, items: { type: string } }
        panelsRepaired: { type: array, nullable: true, items: { type: string } }
        startersSent: { type: array, nullable: true, items: { type: string } }
        preserved: { type: array, nullable: true, items: { type: string } }
        broken: { type: array, nullable: true, items: { type: string } }
        blocked: { type: array, nullable: true, items: { type: string } }
        retirable: { type: integer }

    ChannelLayoutStatusResponse:
      type: object
      properties:
        routes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ChannelRouteInfo" }
        destinations: { type: array, items: { $ref: "#/components/schemas/ChannelDestinationReport" } }
        retirable: { type: array, items: { $ref: "#/components/schemas/RetirableChannel" } }

    CleanupRetiredChannelsResponse:
      type: object
      properties:
        deleted: { type: array, items: { $ref: "#/components/schemas/RetirableChannel" } }
        skipped:
          type: array
          items:
            type: object
            properties:
              channelId: { type: string }
              reason: { type: string, enum: [NOT_RETIRABLE, REFERENCED, NOT_EMPTY, DISCORD_ERROR, GONE] }

    CreateDiscordChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Normalized into a Discord-safe channel name (lowercased, hyphenated) before creation.
        categoryId:
          type: string
          description: Optional. Must already belong to this installation's own Discord guild.

    FinalizeSetupResponse:
      type: object
      properties:
        completed: { type: boolean }
        installation: { $ref: "#/components/schemas/InstallationSummary" }

    HubDiscordSummary:
      type: object
      properties:
        guildName: { type: string }
        guildIcon: { type: string }
        botInstalled: { type: boolean }

    InstallationGeneralSettings:
      type: object
      description: >
        The customer-editable general settings surface - deliberately
        separate from the channel-specific settings endpoints, never
        overloaded onto them.
      properties:
        timezone: { type: string, description: Required on PUT. }
        distanceUnit: { type: string, enum: [METERS, FEET] }
        onlineDisplayEnabled: { type: boolean }
        leaderboardEnabled: { type: boolean }

    HubSummary:
      type: object
      description: >
        Everything the customer landing page needs in one call. Reuses
        existing DTOs/repositories throughout - never a duplicate
        installation/organization model. Never includes a Nitrado token,
        encrypted credential, Discord bot token, WEBSITE_API_SECRET, or
        database detail.
      properties:
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        subscription:
          allOf: [{ $ref: "#/components/schemas/SubscriptionSummary" }]
          nullable: true
        installation: { $ref: "#/components/schemas/InstallationSummary" }
        discord:
          allOf: [{ $ref: "#/components/schemas/HubDiscordSummary" }]
          nullable: true
        dayzServer:
          allOf: [{ $ref: "#/components/schemas/DayZServerSummary" }]
          nullable: true
        channelRoutes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ChannelRouteInfo" }
        settings: { $ref: "#/components/schemas/InstallationGeneralSettings" }

    FactionRecruitmentStatus:
      type: string
      enum: [OPEN, INVITE_ONLY, CLOSED]
      description: OPEN accepts applications; INVITE_ONLY and CLOSED refuse them (409).
    FactionRole:
      type: string
      enum: [LEADER, OFFICER, MEMBER]
    FactionApplicationStatus:
      type: string
      enum: [PENDING, ACCEPTED, DENIED, WITHDRAWN, CANCELLED]
    FactionRequirements:
      type: object
      description: Display and application requirements only - never enforced, never a real-world identity check.
      properties:
        minimumHours: { type: integer, nullable: true, minimum: 0, maximum: 100000 }
        minimumAge: { type: integer, nullable: true, minimum: 13, maximum: 99 }
        pvpRequired: { type: boolean }
        builderNeeded: { type: boolean }
        micRequired: { type: boolean }
        customRequirements: { type: string, maxLength: 500, description: "Plain text; render escaped." }
    FactionSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        tag: { type: string }
        slug: { type: string, description: "Unique within the installation only; stable across renames." }
        descriptionPreview: { type: string, maxLength: 140 }
        recruitmentStatus: { $ref: "#/components/schemas/FactionRecruitmentStatus" }
        memberCount: { type: integer }
        logoKey: { type: string, nullable: true, description: "Placeholder for an approved catalog key; always null in Phase 1." }
        flagKey: { type: string, nullable: true }
        armbandKey: { type: string, nullable: true }
        primaryColor: { type: string, nullable: true, description: "#RRGGBB" }
        secondaryColor: { type: string, nullable: true }
        logo: { $ref: "#/components/schemas/FactionLogo" }
    FactionMember:
      type: object
      properties:
        id: { type: integer, format: int64, description: "The membership id used in the member routes." }
        userId: { type: integer, format: int64 }
        discordUserId: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatar: { type: string }
        gamertag: { type: string, nullable: true, description: "The linked DayZ player name when the user has a verified link; never invented." }
        role: { $ref: "#/components/schemas/FactionRole" }
        joinedAt: { type: string, format: date-time }
    FactionProfile:
      allOf:
        - { $ref: "#/components/schemas/FactionSummary" }
        - type: object
          description: Public profile. Never includes application data.
          properties:
            installationId: { type: integer, format: int64 }
            gameServerId: { type: integer, format: int64 }
            description: { type: string, maxLength: 500, description: "Plain text; render escaped." }
            requirements: { $ref: "#/components/schemas/FactionRequirements" }
            leader: { allOf: [{ $ref: "#/components/schemas/FactionMember" }], nullable: true }
            officers: { type: array, items: { $ref: "#/components/schemas/FactionMember" } }
            members: { type: array, description: "Most senior first, at most 100.", items: { $ref: "#/components/schemas/FactionMember" } }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            stats: { $ref: "#/components/schemas/FactionStatsSummary" }
            viewer:
              type: object
              properties:
                role: { allOf: [{ $ref: "#/components/schemas/FactionRole" }], nullable: true }
                canEdit: { type: boolean }
                canManageApplications: { type: boolean }
                moderationView: { type: boolean, description: "True for an organization OWNER/ADMIN - a read-only view, never a mutation right." }
    FactionApplication:
      type: object
      properties:
        id: { type: integer, format: int64 }
        factionId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        applicant:
          type: object
          properties:
            discordUserId: { type: string }
            username: { type: string }
            displayName: { type: string }
            avatar: { type: string }
        status: { $ref: "#/components/schemas/FactionApplicationStatus" }
        message: { type: string, maxLength: 500 }
        reviewedByUserId: { type: integer, format: int64, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        faction:
          type: object
          description: Present on the pendingApplications of GET .../factions/me only.
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            tag: { type: string }
            slug: { type: string }
    FactionDirectoryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FactionSummary" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer }
    FactionApplicationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FactionApplication" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer }
    FactionMemberList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FactionMember" } }
        total: { type: integer, description: "The real member count, even when items is capped by limit." }
        limit: { type: integer }
    MyFaction:
      type: object
      properties:
        faction: { allOf: [{ $ref: "#/components/schemas/FactionSummary" }], nullable: true }
        membership: { allOf: [{ $ref: "#/components/schemas/FactionMember" }], nullable: true }
        role: { allOf: [{ $ref: "#/components/schemas/FactionRole" }], nullable: true }
        pendingApplications: { type: array, items: { $ref: "#/components/schemas/FactionApplication" } }
    CreateFactionRequest:
      type: object
      additionalProperties: false
      required: [name, tag]
      properties:
        name: { type: string, minLength: 3, maxLength: 32, description: "Letters, digits, spaces and - _ . ' & ! only." }
        tag: { type: string, minLength: 2, maxLength: 5, description: "ASCII letters/digits; stored upper-case." }
        description: { type: string, maxLength: 500 }
        recruitmentStatus: { $ref: "#/components/schemas/FactionRecruitmentStatus" }
    UpdateFactionRequest:
      type: object
      additionalProperties: false
      description: >
        Every field is optional (absent = unchanged). Organization, installation, server, slug and the
        visual keys are not editable; unknown keys are rejected with 400.
      properties:
        name: { type: string, minLength: 3, maxLength: 32 }
        tag: { type: string, minLength: 2, maxLength: 5 }
        description: { type: string, maxLength: 500 }
        recruitmentStatus: { $ref: "#/components/schemas/FactionRecruitmentStatus" }
        primaryColor: { type: string, description: "#RRGGBB, or empty to clear." }
        secondaryColor: { type: string }
        flagKey: { type: string, description: "An approved flag key (BLACK BLUE GREEN RED), case-insensitive; empty clears. Anything else is 400." }
        armbandKey: { type: string, description: "An approved armband key (BLACK BLUE GREEN ORANGE PINK RED WHITE YELLOW), case-insensitive; empty clears. Anything else is 400." }
        requirements: { $ref: "#/components/schemas/FactionRequirements" }
    ApplyToFactionRequest:
      type: object
      additionalProperties: false
      properties:
        message: { type: string, maxLength: 500 }
    AcceptFactionApplicationResponse:
      type: object
      properties:
        application: { $ref: "#/components/schemas/FactionApplication" }
        member: { $ref: "#/components/schemas/FactionMember" }
    RemovedFactionMember:
      type: object
      properties:
        removed: { type: boolean }
        member: { $ref: "#/components/schemas/FactionMember" }

    FactionLogo:
      type: object
      nullable: true
      description: >
        The faction's uploaded logo, or null for the Champion default logo. Carries no storage key, bucket or
        credential. The URL is public and needs no authentication; a new upload always has a new URL.
      properties:
        id: { type: integer, format: int64 }
        url: { type: string, description: "Absolute when the service knows its public origin, otherwise root-relative (/assets/faction-logos/<uuid>.<ext>)." }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        width: { type: integer, minimum: 128, maximum: 2048 }
        height: { type: integer, minimum: 128, maximum: 2048 }
    UploadFactionLogoRequest:
      type: object
      description: multipart/form-data with exactly one part named file. Any other field is 400.
      required: [file]
      properties:
        file: { type: string, format: binary, description: "PNG, JPEG or WebP; at most 5 MiB; each side 128-2048 px. Judged from the bytes, not the name or declared type." }
    UploadFactionLogoResponse:
      type: object
      properties:
        logo: { $ref: "#/components/schemas/FactionLogo" }
        replaced: { type: boolean, description: "true when an earlier logo was replaced (HTTP 200); false for a first logo (HTTP 201)." }
    DeleteFactionLogoResponse:
      type: object
      properties:
        logo: { type: object, nullable: true, description: Always null - the faction is back on the Champion default logo. }
        deleted: { type: boolean, description: "false when there was no logo (the call is idempotent)." }
    TransferLeadershipRequest:
      type: object
      additionalProperties: false
      required: [memberId]
      properties:
        memberId: { type: integer, format: int64, description: "The target's membership id (FactionMember.id) in THIS faction." }
    TransferLeadershipResponse:
      type: object
      properties:
        leader: { $ref: "#/components/schemas/FactionMember" }
        previousLeader: { $ref: "#/components/schemas/FactionMember", description: "Now an OFFICER." }
    LeaveFactionResponse:
      type: object
      properties:
        left: { type: boolean }
        member: { $ref: "#/components/schemas/FactionMember", description: The membership that ended. }
    FactionFlagKey:
      type: string
      enum: [BLACK, BLUE, GREEN, RED]
      description: Approved DayZ flag keys (server-validated; the website mirrors this list).
    FactionArmbandKey:
      type: string
      enum: [BLACK, BLUE, GREEN, ORANGE, PINK, RED, WHITE, YELLOW]
      description: Approved armband keys (server-validated).

    FactionStatsSummary:
      type: object
      nullable: true
      description: >
        The faction's competitive summary. Every figure is derived from real kills, deaths and bounties, attributed through
        members' verified DayZ links and only while they were members (docs/FACTION_STATS.md). Flat and comparable so a future
        faction leaderboard can rank on it; there is no overall skill score.
      properties:
        kills: { type: integer, format: int64 }
        deaths: { type: integer, format: int64 }
        kdRatio: { type: number, description: "kills / max(deaths,1), two decimals; with zero deaths it equals kills." }
        headshots: { type: integer, format: int64 }
        longshots: { type: integer, format: int64 }
        currentKillStreak: { type: integer, description: "Largest ongoing streak among current members." }
        bestKillStreak: { type: integer, description: "Best single member's streak, per membership period." }
        bountiesClaimed: { type: integer, format: int64 }
        bountyValueClaimed: { type: integer, format: int64 }
        memberCount: { type: integer }
        linkedMemberCount: { type: integer, description: "Current members whose figures are attributable (verified link)." }
        achievementsUnlocked: { type: integer }
        trackingSince: { type: string, format: date-time, nullable: true, description: "Figures cover events from the first recorded membership period on." }
    FactionMemberContribution:
      type: object
      properties:
        memberId: { type: integer, format: int64, nullable: true, description: "Current membership id; null for a former member." }
        discordUserId: { type: string }
        displayName: { type: string }
        avatar: { type: string }
        gamertag: { type: string, nullable: true, description: "The verified linked gamertag." }
        role: { allOf: [{ $ref: "#/components/schemas/FactionRole" }], nullable: true }
        status: { type: string, enum: [ACTIVE, FORMER] }
        identity: { type: string, enum: [LINKED, UNLINKED], description: "UNLINKED members have all figures zero and statsEligible false." }
        statsEligible: { type: boolean }
        joinedAt: { type: string, format: date-time }
        kills: { type: integer, format: int64 }
        deaths: { type: integer, format: int64 }
        kdRatio: { type: number }
        headshots: { type: integer, format: int64 }
        longshots: { type: integer, format: int64 }
        currentKillStreak: { type: integer }
        bestKillStreak: { type: integer }
        bountiesClaimed: { type: integer, format: int64 }
        bountyValueClaimed: { type: integer, format: int64 }
    FactionStats:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/FactionStatsSummary" }
        memberContributions: { type: array, description: "Ordered kills DESC, deaths ASC, member id.", items: { $ref: "#/components/schemas/FactionMemberContribution" } }
        updatedAt: { type: string, format: date-time, description: "When the figures were computed (cached up to 45 seconds)." }
    FactionAchievement:
      type: object
      properties:
        key: { type: string, enum: [FIRST_BLOOD, KILLS_100, KILLS_500, KILLS_1000, HEADHUNTERS, LONG_RANGE, BOUNTY_HUNTERS, KILLING_MACHINE, FULL_SQUAD, VETERAN_FACTION] }
        name: { type: string }
        description: { type: string }
        unlocked: { type: boolean }
        unlockedAt: { type: string, format: date-time, nullable: true, description: "When the condition was really met when the data says so, otherwise when it was recorded." }
        progress: { type: integer, description: "The real measured value, capped at target." }
        target: { type: integer }
        unit: { type: string, enum: [kills, headshots, longshots, bounties, members, days] }
    FactionAchievementList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FactionAchievement" } }
        unlockedCount: { type: integer }
        total: { type: integer }
    FactionActivityMember:
      type: object
      nullable: true
      properties:
        discordUserId: { type: string }
        displayName: { type: string }
        avatar: { type: string }
        gamertag: { type: string, nullable: true }
    FactionActivityEvent:
      type: object
      description: One public-safe event. Never carries application messages, moderation detail, free text or internal ids. Treat type as an open set.
      properties:
        id: { type: string, description: "Opaque, stable event key." }
        type: { type: string, enum: [FACTION_CREATED, MEMBER_JOINED, MEMBER_LEFT, MEMBER_PROMOTED, MEMBER_DEMOTED, LEADERSHIP_TRANSFERRED, FACTION_UPDATED, FACTION_LOGO_CHANGED, KILL, HEADSHOT, LONGSHOT, BOUNTY_CLAIMED, SERVER_RECORD, ACHIEVEMENT_UNLOCKED] }
        occurredAt: { type: string, format: date-time }
        member: { $ref: "#/components/schemas/FactionActivityMember" }
        details:
          type: object
          additionalProperties: true
          description: "Per type: role (promotions/demotions), previousLeader, victim/weapon/distanceMeters/headshot/longshot (kills), target/rewardPoints/bounties (bounty claims), record, key/name (achievements)."
    FactionActivityPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FactionActivityEvent" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer }

    FactionLeaderboardMetric:
      type: string
      enum: [KILLS, DEATHS, KD, HEADSHOTS, LONGSHOTS, BEST_STREAK, BOUNTIES_CLAIMED, BOUNTY_VALUE, ACHIEVEMENTS]
      description: "The closed set of ranked metrics. DESC (more is better) for every metric except DEATHS, which is ASC (fewest first). There is no overall/hidden score."
    FactionLeaderboardStats:
      type: object
      description: Every metric of one faction, named like the faction profile's summary (the same figures - one shared SQL definition).
      properties:
        kills: { type: integer, format: int64 }
        deaths: { type: integer, format: int64 }
        kdRatio: { type: number, description: "kills / max(deaths,1), two decimals." }
        headshots: { type: integer, format: int64 }
        longshots: { type: integer, format: int64 }
        bestKillStreak: { type: integer }
        bountiesClaimed: { type: integer, format: int64 }
        bountyValueClaimed: { type: integer, format: int64 }
        achievementsUnlocked: { type: integer }
    FactionLeaderboardEntry:
      type: object
      properties:
        rank: { type: integer, minimum: 1, description: "Ordinal position on the whole installation leaderboard (ties get consecutive ranks in the deterministic order); unaffected by q and paging." }
        factionId: { type: integer, format: int64 }
        name: { type: string }
        tag: { type: string }
        slug: { type: string }
        logo: { allOf: [{ $ref: "#/components/schemas/FactionLogo" }], nullable: true, description: "The uploaded logo exactly as on the profile; null = the Champion default." }
        flagKey: { type: string, nullable: true }
        armbandKey: { type: string, nullable: true }
        primaryColor: { type: string, nullable: true }
        secondaryColor: { type: string, nullable: true }
        memberCount: { type: integer }
        value:
          type: number
          description: "The ranked metric. An integer for every metric except KD, which is a decimal with two places."
        trackingSince: { type: string, format: date-time, nullable: true, description: "Figures cover events from the faction's first recorded membership period on." }
        hasTrackedActivity: { type: boolean, description: "False when the faction has no counted kill, death or bounty (it is still listed, with zero figures)." }
        stats: { $ref: "#/components/schemas/FactionLeaderboardStats" }
    FactionLeaderboardResponse:
      type: object
      properties:
        metric: { $ref: "#/components/schemas/FactionLeaderboardMetric" }
        direction: { type: string, enum: [DESC, ASC], description: "ASC only for DEATHS." }
        items: { type: array, items: { $ref: "#/components/schemas/FactionLeaderboardEntry" } }
        nextCursor: { type: string, nullable: true, description: "Opaque; pass back with the same metric." }
        limit: { type: integer, description: "The effective page size (default 25, max 100)." }
        total: { type: integer, description: "Factions matching q (all factions when there is no q)." }
        updatedAt: { type: string, format: date-time, description: "When the ranking was computed (cached up to 45 seconds)." }

    EconomyCurrency:
      type: object
      properties:
        code: { type: string, enum: [CHAMPION_POINTS] }
        name: { type: string, enum: [Champion Points] }
        symbol: { type: string, example: pts }
    EconomyAccount:
      type: object
      properties:
        accountId: { type: integer, format: int64, description: "The DayZ player id inside the installation's Discord guild (never a display name)." }
        gamertag: { type: string }
        balance: { type: integer, format: int64, minimum: 0, description: Whole Champion Points. }
        updatedAt: { type: string, format: date-time, nullable: true, description: "Last balance change; null = no economy activity yet." }
    EconomyBalanceResponse:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        account: { $ref: "#/components/schemas/EconomyAccount" }
        installationId: { type: integer, format: int64 }
        gameServerId: { type: integer, format: int64, nullable: true }
    EconomyTransaction:
      type: object
      properties:
        id: { type: integer, format: int64, description: "Ledger id; strictly decreasing down the list." }
        type: { type: string, description: "Open set: BOUNTY_CLAIM, ADMIN_CREDIT, ADMIN_DEBIT, SYSTEM_REWARD, SHOP_PURCHASE, SHOP_REFUND, EVENT_FIRST_PLACE, EVENT_SECOND_PLACE, EVENT_THIRD_PLACE." }
        direction: { type: string, enum: [CREDIT, DEBIT] }
        amount: { type: integer, format: int64, description: Positive magnitude. }
        balanceAfter: { type: integer, format: int64 }
        description: { type: string, description: "Generated from the type; never free text." }
        referenceType: { type: string, nullable: true, enum: [BOUNTY, EVENT, SHOP] }
        createdAt: { type: string, format: date-time }
    EconomyTransactionList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, description: Newest first., items: { $ref: "#/components/schemas/EconomyTransaction" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer, description: "Effective page size (default 25, max 100)." }
    AdminEconomyAccount:
      allOf:
        - $ref: "#/components/schemas/EconomyAccount"
        - type: object
          properties:
            linked: { type: boolean, description: Has a VERIFIED Champion identity. }
            discordUserId: { type: string, nullable: true }
            displayName: { type: string, nullable: true }
            avatar: { type: string, nullable: true }
    AdminEconomyAccountList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, items: { $ref: "#/components/schemas/AdminEconomyAccount" } }
        limit: { type: integer }
    AdminEconomyAccountResponse:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        account: { $ref: "#/components/schemas/AdminEconomyAccount" }
    AdminEconomyTransaction:
      allOf:
        - $ref: "#/components/schemas/EconomyTransaction"
        - type: object
          properties:
            reason: { type: string, nullable: true, description: "The admin's reason - admins only, never shown to players." }
            actorDiscordUserId: { type: string, nullable: true, description: "Null for system rows." }
            isSystem: { type: boolean }
            referenceId: { type: string, nullable: true, description: "e.g. bounty:42 or admin:<idempotencyKey>." }
            gameServerId: { type: integer, format: int64, nullable: true }
    AdminEconomyTransactionList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, items: { $ref: "#/components/schemas/AdminEconomyTransaction" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer }
    AdjustEconomyRequest:
      type: object
      required: [amount, reason]
      additionalProperties: false
      properties:
        amount: { type: integer, format: int64, minimum: 1, maximum: 1000000000, description: Whole number of Champion Points. }
        reason: { type: string, minLength: 1, maxLength: 200, description: "Required. Stored on the ledger row; shown to admins only." }
        idempotencyKey: { type: string, minLength: 8, maxLength: 64, pattern: "^[A-Za-z0-9._:-]+$", description: "Optional. A retry with the same key returns the original transaction (duplicate: true); the same key with another amount is 409 DUPLICATE_TRANSACTION." }
    EconomyAdjustmentResponse:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        account: { $ref: "#/components/schemas/AdminEconomyAccount" }
        transaction: { $ref: "#/components/schemas/AdminEconomyTransaction" }
        duplicate: { type: boolean, description: "True = an idempotent replay: nothing changed." }

    ShopCategoryRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
    ShopCategory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        productCount: { type: integer, description: Active products in the category. }
    AdminShopCategory:
      allOf:
        - $ref: "#/components/schemas/ShopCategory"
        - type: object
          properties:
            isActive: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ShopCategoryList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, items: { $ref: "#/components/schemas/ShopCategory" } }
    AdminShopCategoryList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, items: { $ref: "#/components/schemas/AdminShopCategory" } }
    ShopCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: Required on create. }
        description: { type: string, maxLength: 500 }
        sortOrder: { type: integer }
        isActive: { type: boolean, description: "Update only. A disabled category hides its products from players." }
    ShopProduct:
      type: object
      description: The public product. Never carries the exact stock, the active flag or timestamps.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        pricePoints: { type: integer, format: int64, description: Whole Champion Points. }
        category: { allOf: [{ $ref: "#/components/schemas/ShopCategoryRef" }], nullable: true }
        productType: { type: string, enum: [ITEM, LOADOUT, VEHICLE, SERVICE, CUSTOM] }
        deliveryType: { type: string, description: "Open set. Only MANUAL exists; DISCORD_ROLE and IN_GAME_FUTURE are reserved and rejected." }
        isFeatured: { type: boolean }
        stockState: { type: string, enum: [UNLIMITED, IN_STOCK, LOW_STOCK, OUT_OF_STOCK] }
        purchaseLimit: { type: integer, nullable: true, description: "Units per player." }
    AdminShopProduct:
      allOf:
        - $ref: "#/components/schemas/ShopProduct"
        - type: object
          properties:
            isActive: { type: boolean }
            stockMode: { type: string, enum: [UNLIMITED, FINITE] }
            stockQuantity: { type: integer, format: int64, nullable: true }
            sortOrder: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ShopProductList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, items: { $ref: "#/components/schemas/ShopProduct" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer }
    AdminShopProductList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, items: { $ref: "#/components/schemas/AdminShopProduct" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer }
    CreateShopProductRequest:
      type: object
      required: [name, pricePoints, productType]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        categoryId: { type: integer, format: int64, nullable: true }
        pricePoints: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
        productType: { type: string, enum: [ITEM, LOADOUT, VEHICLE, SERVICE, CUSTOM] }
        deliveryType: { type: string, enum: [MANUAL], default: MANUAL }
        isActive: { type: boolean, default: true }
        isFeatured: { type: boolean, default: false }
        sortOrder: { type: integer }
        stockMode: { type: string, enum: [UNLIMITED, FINITE], default: UNLIMITED }
        stockQuantity: { type: integer, format: int64, nullable: true, description: "Required (0..1e9) for FINITE, omitted for UNLIMITED." }
        purchaseLimit: { type: integer, nullable: true, minimum: 1, maximum: 1000 }
    UpdateShopProductRequest:
      type: object
      additionalProperties: false
      description: "Every field optional (absent = unchanged); categoryId and purchaseLimit accept null to clear. The tenant, slug and productType are not editable."
      properties:
        name: { type: string }
        description: { type: string }
        categoryId: { type: integer, format: int64, nullable: true }
        pricePoints: { type: integer, format: int64 }
        deliveryType: { type: string, enum: [MANUAL] }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        sortOrder: { type: integer }
        stockMode: { type: string, enum: [UNLIMITED, FINITE] }
        stockQuantity: { type: integer, format: int64 }
        purchaseLimit: { type: integer, nullable: true }
    AdminShopProductResponse:
      type: object
      properties:
        product: { $ref: "#/components/schemas/AdminShopProduct" }
    ShopPurchaseRequest:
      type: object
      required: [productId, quantity, idempotencyKey]
      additionalProperties: false
      properties:
        productId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 64, pattern: "^[A-Za-z0-9._:-]+$", description: "Reuse it to retry safely: the original purchase is returned (duplicate true). The same key with different data is 409 DUPLICATE_PURCHASE." }
    ShopPurchaseItem:
      type: object
      description: Snapshot taken at purchase time; never changes when the product is edited.
      properties:
        productId: { type: integer, format: int64, nullable: true }
        productName: { type: string }
        unitPricePoints: { type: integer, format: int64 }
        quantity: { type: integer }
        lineTotalPoints: { type: integer, format: int64 }
    ShopPurchase:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, description: "Open set. Used: PENDING_FULFILLMENT, FULFILLED, REFUNDED. Reserved: PENDING, PAID, CANCELLED, FAILED.", enum: [PENDING, PAID, PENDING_FULFILLMENT, FULFILLED, CANCELLED, REFUNDED, FAILED] }
        totalPoints: { type: integer, format: int64 }
        deliveryType: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/ShopPurchaseItem" } }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        fulfilledAt: { type: string, format: date-time, nullable: true }
        refundedAt: { type: string, format: date-time, nullable: true }
    AdminShopPurchase:
      allOf:
        - $ref: "#/components/schemas/ShopPurchase"
        - type: object
          properties:
            player:
              type: object
              properties:
                accountId: { type: integer, format: int64 }
                gamertag: { type: string }
            gameServerId: { type: integer, format: int64, nullable: true }
            refundReason: { type: string, nullable: true, description: Admin only. }
            fulfilledByDiscordUserId: { type: string, nullable: true }
            refundedByDiscordUserId: { type: string, nullable: true }
    ShopPurchaseResponse:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        purchase: { $ref: "#/components/schemas/ShopPurchase" }
        remainingBalance: { type: integer, format: int64, description: "The authoritative balance right after the debit (a replay: the current balance)." }
        duplicate: { type: boolean }
    AdminShopPurchaseResponse:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        purchase: { $ref: "#/components/schemas/AdminShopPurchase" }
        remainingBalance: { type: integer, format: int64 }
        duplicate: { type: boolean }
    ShopPurchaseList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, items: { $ref: "#/components/schemas/ShopPurchase" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer }
    AdminShopPurchaseList:
      type: object
      properties:
        currency: { $ref: "#/components/schemas/EconomyCurrency" }
        items: { type: array, items: { $ref: "#/components/schemas/AdminShopPurchase" } }
        nextCursor: { type: string, nullable: true }
        limit: { type: integer }
    ShopRefundRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 200, description: "Required; stored for admins, never shown to the player." }

    BillingPrice:
      type: object
      description: No Stripe price id - public-safe pricing only.
      properties:
        amountCents: { type: integer, format: int64 }
        currency: { type: string, example: usd }
    BillingPlan:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        features: { type: array, items: { type: string } }
        limits: { type: object, additionalProperties: { type: integer } }
        monthly: { allOf: [{ $ref: "#/components/schemas/BillingPrice" }], nullable: true, description: "Null = not sold monthly." }
        yearly: { allOf: [{ $ref: "#/components/schemas/BillingPrice" }], nullable: true, description: "Null = not sold yearly." }
        popular: { type: boolean }
        trialDays: { type: integer, description: "Stripe trial days - always 0 since Customer Onboarding V2 (the only trial is the no-card 14-day trial)." }
        sortOrder: { type: integer }
    BillingPlansResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BillingPlan" } }
    BillingSubscriptionSummary:
      type: object
      description: The dedicated billing endpoints' subscription view. Never carries a Stripe id.
      properties:
        plan: { type: string }
        status: { type: string, enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED, SUSPENDED, INACTIVE] }
        billingInterval: { type: string, enum: [MONTHLY, YEARLY], nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodStart: { type: string, format: date-time, nullable: true }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        entitlements: { type: array, items: { type: string } }
        hasBillingCustomer: { type: boolean, description: A Portal session can be created. }
        hasActiveSubscription: { type: boolean, description: Checkout has completed at least once - plan/cancel/reactivate apply. }
        canManageBilling: { type: boolean, description: The acting user is this organization's OWNER/ADMIN. }
        intendedPlan: { type: string, nullable: true, description: "Plan picked before paying (Onboarding V2). A preference only - never grants anything." }
        trialStatus: { type: string, enum: [NOT_STARTED, ACTIVE, EXPIRED, NOT_ELIGIBLE, CONVERTED] }
        trialDaysRemaining: { type: integer, description: Whole days left (rounded up); 0 unless trialStatus is ACTIVE. }
        billingRequired: { type: boolean, description: True when a paid plan must be activated to set up a (new) service. }
    TrialState:
      type: object
      description: Customer Onboarding V2 trial state (docs/BILLING.md section 28). Never carries a Stripe id.
      properties:
        trialStatus: { type: string, enum: [NOT_STARTED, ACTIVE, EXPIRED, NOT_ELIGIBLE, CONVERTED] }
        subscriptionStatus: { type: string, nullable: true, enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED, SUSPENDED, INACTIVE] }
        selectedPlan: { type: string, nullable: true, description: The intended plan while not paying; the paid plan once CONVERTED. }
        trialStartedAt: { type: string, format: date-time, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        daysRemaining: { type: integer }
        billingRequired: { type: boolean }
        paymentMethodRequired: { type: boolean, description: Always false - starting the trial never needs a payment method. }
        started: { type: boolean, description: This request started the trial. }
        installationLimit: { type: integer }
        installationCount: { type: integer }
    StartTrialRequest:
      type: object
      additionalProperties: false
      properties:
        planKey: { type: string, description: "Optional public plan key (LOW/MEDIUM/HIGH) recorded as the intended plan - not a purchase." }
    CheckoutRequest:
      type: object
      required: [planKey, interval]
      additionalProperties: false
      properties:
        planKey: { type: string }
        interval: { type: string, enum: [MONTHLY, YEARLY] }
        returnPath: { type: string, description: "Optional, root-relative (must start with /). The origin is always chosen server-side." }
    CheckoutResponse:
      type: object
      properties:
        checkoutUrl: { type: string, format: uri }
    PortalRequest:
      type: object
      additionalProperties: false
      properties:
        returnPath: { type: string }
    PortalResponse:
      type: object
      properties:
        portalUrl: { type: string, format: uri }
    ChangePlanRequest:
      type: object
      required: [planKey, interval]
      additionalProperties: false
      properties:
        planKey: { type: string }
        interval: { type: string, enum: [MONTHLY, YEARLY] }

    PlayerServerSummary:
      type: object
      description: >-
        One installation the acting user has a legitimate, proven player association with (docs/PLAYER_API.md).
        organizationId is deliberately never included - a Player is not an organization member.
      properties:
        installationId: { type: integer, format: int64 }
        serverName: { type: string }
        platform: { type: string }
        serverStatus: { type: string }
        discordGuildName: { type: string }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        linkedPlayerId: { type: integer, format: int64 }
    PlayerServersResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlayerServerSummary" } }
        defaultInstallationId: { type: integer, format: int64, nullable: true, description: "Most-recently-active installation; null when items is empty." }
    PlayerStats:
      type: object
      description: >-
        Scoped strictly to one installation's own DayZ server (docs/PLAYER_API.md "Installation isolation").
        bestStreak/currentStreak and the classic per-player faction are intentionally not included - both
        are only tracked guild-wide in the current data model, not per-server.
      properties:
        installationId: { type: integer, format: int64 }
        kills: { type: integer }
        deaths: { type: integer }
        kd: { type: number, format: double }
        headshots: { type: integer }
        longshots: { type: integer }
        longestKillMeters: { type: number, format: double }
        playtimeSeconds: { type: integer, format: int64 }
        bountiesClaimed: { type: integer }
        bountyValue: { type: integer, format: int64 }
        faction: { type: string, nullable: true, description: "Faction Hub faction name on THIS installation, or null." }
        lastSeenAt: { type: string, format: date-time, nullable: true }

  responses:
    Unauthorized:
      description: Missing/invalid service auth, or acting user not synced.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Not a member of the organization, or lacks OWNER/ADMIN.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadRequest:
      description: Invalid request (bad id or route key).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource doesn't exist, or doesn't belong to the acting organization.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Slug or guild already claimed by another organization.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    InvalidRequest:
      description: Malformed body, invalid ID, or an invalid setup-progress transition.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    RateLimited:
      description: Too many requests for this route/caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NitradoUnavailable:
      description: Nitrado rejected the request, or is unreachable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

paths:
  /api/saas/users/sync:
    post:
      summary: Sync safe Discord identity fields (never an OAuth token).
      security: [{ serviceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSyncRequest" }
      responses:
        "200":
          description: Synced user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/saas/organizations:
    get:
      summary: List organizations the acting user belongs to.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }]
      responses:
        "200":
          description: Organizations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create an organization + OWNER membership atomically.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/saas/organizations/{organizationID}:
    get:
      summary: Get one organization (membership required).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/dashboard:
    get:
      summary: One-call customer dashboard summary.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      responses:
        "200":
          description: Dashboard summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations:
    post:
      summary: Create an installation (OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstallationRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402":
          description: "BILLING_REQUIRED - no running trial or paid plan (trial expired, account already used its trial, subscription ended). Existing data is kept."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "CONFLICT - this guild connection already has an unconfigured installation; or INSTALLATION_LIMIT_REACHED - the plan's installation capacity is used (trial: 1). Nothing existing is modified."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/saas/organizations/{organizationID}/installations/{installationID}:
    get:
      summary: Get one installation.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Installation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/setup:
    get:
      summary: Get resumable setup progress.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Setup progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupProgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update setup progress (OWNER/ADMIN). Step order enforced server-side.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupProgressPatchRequest" }
      responses:
        "200":
          description: Updated setup progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupProgress" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/discord/guilds/eligible:
    post:
      summary: Re-derive eligibility for OAuth-verified guild candidates.
      description: >
        botInstalled comes from the bot's local gateway state cache (zero
        Discord REST calls per candidate) - never a live per-guild lookup.
        The final selected guild is still live-verified by
        /discord/connection and /discord/verify-installation.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EligibleGuildsRequest" }
      responses:
        "200":
          description: Eligibility results.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscordGuildSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/discord/connection:
    post:
      summary: Persist a verified Discord guild selection (OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectGuildRequest" }
      responses:
        "200":
          description: Persisted connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscordGuildConnectionSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Discord bot session unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/discord/verify-installation:
    post:
      summary: Verify live bot presence in the connected guild; may advance NOT_STARTED to DISCORD_CONNECTED.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscordInstallationVerification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Discord bot session unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/discord/verify-permissions:
    post:
      summary: Check live bot channel permissions (View Channel, Send Messages, Embed Links, Read Message History).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPermissionsRequest" }
      responses:
        "200":
          description: Permission verification result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscordPermissionVerification" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Installation not yet Discord-verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Discord bot session unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/nitrado/connect:
    post:
      summary: Validate a Nitrado account token live and store its encrypted credential envelope (OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NitradoConnectRequest" }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NitradoConnectResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NitradoUnavailable" }

  /api/saas/organizations/{organizationID}/nitrado/services:
    get:
      summary: Discover the connected account's supported DayZ console services (PlayStation + Xbox only).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      responses:
        "200":
          description: Supported services.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NitradoServiceSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No Nitrado connection exists yet for this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503": { $ref: "#/components/responses/NitradoUnavailable" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/dayz-server:
    post:
      summary: Select a discovered service as the installation's DayZ server (OWNER/ADMIN). Re-verifies live before persisting.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectDayZServerRequest" }
      responses:
        "200":
          description: >
            Selected, or reused (see SelectDayZServerResponse.reusedInstallation)
            when this guild+server pair already belonged to a different
            existing installation in the same organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelectDayZServerResponse" }
        "400":
          description: Invalid request, or the service is not a supported DayZ console platform.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Installation not found, or the service isn't on the connected Nitrado account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: This game_servers row is already owned by a different organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503": { $ref: "#/components/responses/NitradoUnavailable" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/dayz-server/validate:
    post:
      summary: Safe, read-only live check that the selected DayZ server is still reachable and supported.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Validation result (reachable/supported reflect reality even when false - this is a status check, not an error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayZServerValidation" }
        "400":
          description: No DayZ server has been selected for this installation yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/discord/channels:
    get:
      summary: List the installation's guild's Champion-selectable Discord channels (text/announcement, bot-viewable only).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Channels, sorted by position then name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscordChannelSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Discord bot session unavailable, or the channel list could not be loaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      summary: Create a new Discord channel for Customize mode (OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDiscordChannelRequest" }
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscordChannelSummary" }
        "400":
          description: Invalid channel name, or categoryId does not belong to this installation's guild.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Discord bot session unavailable, missing Manage Channels, or channel creation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/channels:
    get:
      summary: Return the installation's persisted channel selection (refresh restoration for Customize mode).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Persisted channel settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationChannelSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Save a manual channel selection (Customize mode, OWNER/ADMIN). Preserves every other settings field.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationChannelSettings" }
      responses:
        "200":
          description: >
            Saved. channelsCompleted=true and currentStep=VALIDATION advance
            on success; the installation's channel configuration is marked
            customer-owned (a later auto-setup call will not overwrite it
            without force=true).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationChannelSettings" }
        "400":
          description: killfeedChannelId missing, or a supplied channel ID does not belong to this installation's guild.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Discord bot session unavailable, or the channel list could not be verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/channels/auto-setup:
    post:
      summary: One-click Channel System V2 setup - creates/reuses a channel only for destinations with a working producer, then verifies each (OWNER/ADMIN). Idempotent.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoSetupChannelsRequest" }
      responses:
        "200":
          description: >
            configured=true with the categories, mapped routes and a
            per-destination report on success; configured=false with a safe
            reason (MISSING_MANAGE_CHANNELS, CUSTOM_CONFIGURATION_EXISTS or
            KILLFEED_UNAVAILABLE) when
            auto-setup could not or should not proceed - both are expected
            outcomes, not errors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoSetupChannelsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Discord bot session unavailable, bot not installed in the guild, or category/channel creation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/channels/layout:
    get:
      summary: Read-only Channel System V2 status - destinations, checks and retirable channels. Nothing is changed.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Current layout status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelLayoutStatusResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/channels/repair:
    post:
      summary: Repair Champion Discord Layout (OWNER/ADMIN) - the one-click engine, preserving every customer-owned route. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Same shape as auto-setup, including summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoSetupChannelsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/channels/cleanup:
    post:
      summary: Clean Up Retired Champion Channels (OWNER/ADMIN) - deletes only confirmed, recorded, unreferenced Champion-owned channels.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelIds]
              properties:
                channelIds: { type: array, items: { type: string } }
      responses:
        "200":
          description: What was deleted and what was kept, with reasons.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupRetiredChannelsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/channel-routes:
    get:
      summary: Return every currently configured feature -> channel route, keyed by route_key.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Configured routes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelRoutesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Save a manual routing selection (Customize mode, OWNER/ADMIN). Partial merge keyed by route_key - never requires every route.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveChannelRoutesRequest" }
      responses:
        "200":
          description: >
            Saved. Returns the full, now-updated route set. Every route
            touched by this call becomes managedByChampion=false.
            channelsCompleted=true and currentStep=VALIDATION advance on
            success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelRoutesResponse" }
        "400":
          description: Unknown route_key, a supplied channel ID does not belong to this installation's guild, or the resulting state would leave KILLFEED unset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Discord bot session unavailable, or the channel list could not be verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/embed-templates:
    get:
      summary: List the installation's customized embed templates (any member). Runtime rendering is behind CHAMPION_CUSTOM_EMBEDS_ENABLED (see runtimeRendering / runtimeRoutes).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Customized routes only, plus the approved variables per route and the enforced limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedTemplateListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/embed-templates/{routeKey}/preview:
    post:
      summary: Render an UNSAVED draft with the production renderer (any member). Saves and sends nothing.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/embedRouteKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedDraftRequest" }
      responses:
        "200":
          description: The rendered draft (renderable=false with a reason when nothing would post).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedPreviewResponse" }
        "400":
          description: EMBED_TEMPLATE_INVALID - invalid draft, unapproved variable or unknown body key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/embed-templates/{routeKey}/test:
    post:
      summary: Send an UNSAVED draft as a labelled test message to the route's own routed channel (OWNER/ADMIN). Mentions disabled; no gameplay effects.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/embedRouteKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedDraftRequest" }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedTestResponse" }
        "400":
          description: EMBED_TEMPLATE_INVALID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: EMBED_ROUTE_NOT_CONFIGURED, EMBED_TEST_CHANNEL_UNAVAILABLE, EMBED_TEST_SEND_FORBIDDEN or EMBED_TEST_EMBED_LINKS_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: EMBED_TEMPLATE_NOT_RENDERABLE or EMBED_CUSTOM_RENDERING_NOT_SUPPORTED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: EMBED_TEST_RATE_LIMITED (1 per 3 s per actor, 10 per minute per installation).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: EMBED_TEST_SEND_FAILED - Discord rejected the message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/embed-templates/{routeKey}:
    get:
      summary: Get one route's template, or the not-customized state (customized=false, template=null).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/embedRouteKey" }
      responses:
        "200":
          description: Stored template or not-customized state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedTemplateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Validate, normalize and upsert one route's template (OWNER/ADMIN). Concurrent saves converge on one row; created_at is kept, updated_at refreshed.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/embedRouteKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedTemplate" }
      responses:
        "200":
          description: The normalized stored template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedTemplateResponse" }
        "400":
          description: Invalid route, color, URL, limit, variable or placeholder, an unknown JSON key, or malformed JSON. The message lists up to five path/problem issues and never echoes the input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Request body over 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    delete:
      summary: Reset this route to the Champion default (OWNER/ADMIN). Idempotent - deletes only this installation+route.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/embedRouteKey" }
      responses:
        "200":
          description: The not-customized state, whether or not a template existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedTemplateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/setup/complete:
    post:
      summary: Finalize onboarding (OWNER/ADMIN). Every prerequisite is re-derived from persisted backend state, never a client claim. Idempotent once READY.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: >
            completed=true with the resulting installation. If already
            READY, this is a no-op success - no prerequisite is re-checked
            and no timestamp is touched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalizeSetupResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: A setup prerequisite isn't met yet (Discord/bot not installed, Nitrado not connected, no DayZ server, no KILLFEED route, setup progress incomplete, or a configured channel is missing a blocking permission). The message names which one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Discord bot session unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/hub:
    get:
      summary: Everything the customer landing page needs in one call.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Hub summary. discord/dayzServer/subscription are omitted (not a failure) when not yet configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HubSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/settings:
    get:
      summary: Return the customer-editable general settings (timezone, distance unit, display toggles).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Persisted general settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationGeneralSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Save general settings (OWNER/ADMIN). Never critical - never touches setup progress, validation, or installation status.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationGeneralSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationGeneralSettings" }
        "400":
          description: timezone missing, or distanceUnit is not METERS/FEET.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Faction Hub (Phase 1; docs/FACTIONS.md). Reads and player actions need only a synced acting user
  # (players are not organization members); faction mutations are decided by the FACTION role. ---
  /api/saas/organizations/{organizationID}/installations/{installationID}/factions:
    get:
      summary: Faction directory (any synced user). Newest first, member counts from one aggregate query.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: recruiting, in: query, required: false, description: "true lists OPEN factions only.", schema: { type: boolean } }
        - { name: q, in: query, required: false, description: "Case-insensitive substring of name or tag, at most 50 characters.", schema: { type: string, maxLength: 50 } }
        - { $ref: "#/components/parameters/factionLimit" }
        - { $ref: "#/components/parameters/factionCursor" }
      responses:
        "200":
          description: One page of faction summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionDirectoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Found a faction (any synced user). The creator becomes LEADER; faction and membership are created in one transaction.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFactionRequest" }
      responses:
        "201":
          description: The new faction profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Name or tag taken on this installation, the user is already in a faction here, the installation has no DayZ server selected, or it is suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413": { description: Request body over 16 KiB. }
        "429": { description: Rate limited (1 per 10 seconds, 10 per day per user). }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/me:
    get:
      summary: The caller's faction (if any), role and pending applications on this installation.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Faction and membership are null when the user is in no faction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyFaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}:
    get:
      summary: Public faction profile (any synced user). Never includes application data.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      responses:
        "200":
          description: Profile with requirements, leader, officers, members and the viewer block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update the profile, recruitment status, colors and requirements (faction LEADER only).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFactionRequest" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionProfile" }
        "400":
          description: Invalid value, or an unknown key (image URLs, logoKey/flagKey/armbandKey, ids, slug).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/applications:
    get:
      summary: List applications (faction LEADER/OFFICER; an organization OWNER/ADMIN gets a read-only moderation view).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/FactionApplicationStatus" } }
        - { $ref: "#/components/parameters/factionLimit" }
        - { $ref: "#/components/parameters/factionCursor" }
      responses:
        "200":
          description: Newest first, including the applicant's message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionApplicationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Apply to join (any synced user). Refused unless the faction is OPEN, the user is in no faction here and has no pending application to it.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyToFactionRequest" }
      responses:
        "201":
          description: The pending application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionApplication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Rate limited (5 per minute, 40 per day per user). }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/applications/{applicationID}/accept:
    post:
      summary: Accept a pending application (LEADER/OFFICER). One transaction - membership, ACCEPTED status, and cancellation of the applicant's other pending applications on this installation.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { $ref: "#/components/parameters/factionApplicationID" }
      responses:
        "200":
          description: The accepted application and the new membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptFactionApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The application is no longer pending, or the applicant is already in a faction on this installation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/applications/{applicationID}/deny:
    post:
      summary: Deny a pending application (LEADER/OFFICER). Records the reviewer and time; history is kept.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { $ref: "#/components/parameters/factionApplicationID" }
      responses:
        "200":
          description: The denied application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/applications/{applicationID}/withdraw:
    post:
      summary: Withdraw the caller's own pending application. Someone else's application is 404.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { $ref: "#/components/parameters/factionApplicationID" }
      responses:
        "200":
          description: The withdrawn application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/members:
    get:
      summary: Public member list, most senior first (any synced user).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { name: limit, in: query, required: false, description: "Default 100, maximum 200.", schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Members and the real total.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionMemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/members/{memberID}/promote:
    post:
      summary: Promote a MEMBER to OFFICER (LEADER only).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { $ref: "#/components/parameters/factionMemberID" }
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The member is not a MEMBER (an officer cannot be promoted; there is no promotion to leader). }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/members/{memberID}/demote:
    post:
      summary: Demote an OFFICER to MEMBER (LEADER only).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { $ref: "#/components/parameters/factionMemberID" }
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The member is not an OFFICER. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/members/{memberID}:
    delete:
      summary: Remove a member. The LEADER removes MEMBER and OFFICER, an OFFICER removes MEMBER only, nobody removes the LEADER (403).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { $ref: "#/components/parameters/factionMemberID" }
      responses:
        "200":
          description: The removed member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemovedFactionMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Faction Hub Phase 4: logo storage, leadership transfer, self-leave (docs/FACTIONS.md) ---
  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/logo:
    post:
      summary: Upload or replace the faction logo (faction LEADER only; checked before the body is read). PNG/JPEG/WebP, at most 5 MiB, 128-2048 px per side. The website sends this server-side.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadFactionLogoRequest" }
      responses:
        "200":
          description: An earlier logo was replaced (its URL stops resolving).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFactionLogoResponse" }
        "201":
          description: First logo stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFactionLogoResponse" }
        "400":
          description: Empty file, corrupt image, dimensions outside 128-2048 px, or an unexpected/duplicate form field (externalUrl, url, base64 text, a second file).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: The logo is over 5 MiB. }
        "415":
          description: Not PNG/JPEG/WebP (SVG, GIF, HTML, PDF, animated WebP...), a declared Content-Type that contradicts the bytes, or a non-multipart body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429": { description: Rate limited (3 per minute, 20 per day per user). }
    delete:
      summary: Delete the faction logo (faction LEADER only). Idempotent - the faction returns to the Champion default logo.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      responses:
        "200":
          description: Always 200; deleted says whether a logo existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteFactionLogoResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/transfer-leadership:
    post:
      summary: Transfer leadership to another member of this faction (current LEADER only). Atomic - the old leader becomes an OFFICER; never zero or two leaders.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferLeadershipRequest" }
      responses:
        "200":
          description: The new leader and the former leader.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferLeadershipResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown faction, or the target is not a member of this faction (or another tenant's). }
        "409": { description: The target is already the leader. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/leave:
    post:
      summary: Leave the faction (the acting user's own membership). MEMBER and OFFICER may; the LEADER gets 409 LEADERSHIP_TRANSFER_REQUIRED and must transfer leadership first.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      responses:
        "200":
          description: The membership that ended. Application history is untouched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveFactionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The caller is not a member of this faction (including a repeated leave). }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: code LEADERSHIP_TRANSFER_REQUIRED - the LEADER cannot leave while leading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /assets/faction-logos/{file}:
    get:
      summary: The public faction logo image (no authentication). file is <publicId>.<png|jpg|webp> - the unguessable id from FactionLogo.url; the extension must match the stored format.
      security: []
      parameters:
        - { name: file, in: path, required: true, schema: { type: string }, description: "<uuid>.<png|jpg|webp>" }
      responses:
        "200":
          description: The image, with nosniff, a sandboxing CSP, an ETag and immutable one-year caching.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Not modified (If-None-Match matched the ETag). }
        "404": { description: Unknown, replaced or deleted logo, or a mismatched extension. }

  # --- Faction Hub Phase 5: competitive stats, achievements, activity (docs/FACTION_STATS.md). Read-only, any synced user. ---
  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/stats:
    get:
      summary: The faction's competitive stats - summary and per-member contributions. Derived from real kills/deaths/bounties, attributed through verified links and membership periods. Cached up to 45 s.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      responses:
        "200":
          description: Summary, contributions and updatedAt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/activity:
    get:
      summary: The faction's public activity feed, newest first (keyset pagination). Public-safe events only.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
        - { name: limit, in: query, required: false, description: "Default 20, maximum 100 (larger values are clamped; 0 or non-numeric is 400).", schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/factionCursor" }
      responses:
        "200":
          description: One page of events and the cursor for the next.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionActivityPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/{factionID}/achievements:
    get:
      summary: The faction's system-defined achievements with unlocked state, unlockedAt and progress/target.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { $ref: "#/components/parameters/factionID" }
      responses:
        "200":
          description: All ten achievements in a stable order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionAchievementList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Faction Hub Phase 6: faction leaderboards (docs/FACTION_LEADERBOARDS.md). Read-only, any synced user. ---
  /api/saas/organizations/{organizationID}/installations/{installationID}/factions/leaderboard:
    get:
      summary: The installation's factions ranked by one explicit metric (keyset pagination, search). Same figures as the faction profiles; no overall score; cached up to 45 s per installation.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - name: metric
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FactionLeaderboardMetric" }
          description: The ranked metric (case-insensitive); default KILLS. Any other value is 400 - it is never mapped to a default.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 25 }
          description: Page size; the maximum is 100 - larger values are clamped, 0/negative/non-numeric is 400.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: The previous page's nextCursor. It is bound to its metric; a cursor from another metric is 400.
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 50 }
          description: Case-insensitive substring of the faction name or tag. Never changes a faction's rank.
      responses:
        "200":
          description: One page of the ranking. Factions with no tracked activity are listed with zero figures and hasTrackedActivity false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionLeaderboardResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Champion Economy web foundation (docs/ECONOMY.md). Champion Points, installation-scoped. ---
  /api/saas/organizations/{organizationID}/installations/{installationID}/economy/me:
    get:
      summary: The acting user's own balance, through their VERIFIED DayZ link. There is no way to name another player.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200":
          description: Currency and the account (balance 0 when there is no activity yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomyBalanceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: code PLAYER_IDENTITY_REQUIRED - the user has no verified DayZ link on this installation's guild.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/economy/me/transactions:
    get:
      summary: The acting user's own transaction history, newest first (keyset pagination). Descriptions are generated from the type; the admin's reason and actor are never included.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 25 }, description: "Maximum 100 - larger values are clamped; 0/negative/non-numeric is 400." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: The previous page's nextCursor. }
        - { name: type, in: query, required: false, schema: { type: string, enum: [BOUNTY_CLAIM, ADMIN_CREDIT, ADMIN_DEBIT, SYSTEM_REWARD, SHOP_PURCHASE, SHOP_REFUND, EVENT_PRIZE] }, description: Optional type filter (EVENT_PRIZE = all event prizes). }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomyTransactionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: code PLAYER_IDENTITY_REQUIRED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429": { description: Rate limited (120 per minute per acting user). }

  /api/saas/organizations/{organizationID}/installations/{installationID}/economy/accounts:
    get:
      summary: Admin lookup of players of the installation's guild by gamertag or verified Discord name. Organization OWNER/ADMIN only (a faction role grants nothing).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 50 }, description: "Case-insensitive substring; LIKE wildcards are literal." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 25 }, description: "Maximum 25." }
      responses:
        "200":
          description: Up to 25 accounts, best match first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEconomyAccountList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code ECONOMY_FORBIDDEN - OWNER or ADMIN role required. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/economy/accounts/{accountID}:
    get:
      summary: One account (organization OWNER/ADMIN). accountID is the DayZ player id inside the installation's guild.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: accountID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEconomyAccountResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code ECONOMY_FORBIDDEN. }
        "404": { description: NOT_FOUND (installation) or ECONOMY_ACCOUNT_NOT_FOUND (an id outside this installation's guild). }

  /api/saas/organizations/{organizationID}/installations/{installationID}/economy/accounts/{accountID}/transactions:
    get:
      summary: Admin history of one account, newest first - includes the reason, the acting admin and the reference.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: accountID, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [BOUNTY_CLAIM, ADMIN_CREDIT, ADMIN_DEBIT, SYSTEM_REWARD, SHOP_PURCHASE, SHOP_REFUND, EVENT_PRIZE] } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEconomyTransactionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code ECONOMY_FORBIDDEN. }
        "404": { description: NOT_FOUND or ECONOMY_ACCOUNT_NOT_FOUND. }
        "429": { description: Rate limited. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/economy/accounts/{accountID}/grant:
    post:
      summary: Admin credit (ADMIN_CREDIT) - adds spendable balance only, never leaderboard score. Organization OWNER/ADMIN; audited; rate limited (30/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: accountID, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustEconomyRequest" }
      responses:
        "200":
          description: Applied (duplicate false) or an idempotent replay of the same idempotencyKey (duplicate true).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomyAdjustmentResponse" }
        "400": { description: "INVALID_AMOUNT (not a whole number 1..1,000,000,000) or INVALID_REQUEST (missing/blank reason, bad key, unknown JSON key)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code ECONOMY_FORBIDDEN. }
        "404": { description: NOT_FOUND or ECONOMY_ACCOUNT_NOT_FOUND. }
        "409": { description: "DUPLICATE_TRANSACTION (idempotencyKey reused with another amount) or CONFLICT (installation suspended / no DayZ server)." }
        "429": { description: RATE_LIMITED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/economy/accounts/{accountID}/debit:
    post:
      summary: Admin debit (ADMIN_DEBIT) - removes spendable balance, never below zero. Organization OWNER/ADMIN; audited; rate limited (30/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: accountID, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustEconomyRequest" }
      responses:
        "200":
          description: Applied or an idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomyAdjustmentResponse" }
        "400": { description: INVALID_AMOUNT or INVALID_REQUEST. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code ECONOMY_FORBIDDEN. }
        "404": { description: NOT_FOUND or ECONOMY_ACCOUNT_NOT_FOUND. }
        "409": { description: "INSUFFICIENT_FUNDS, DUPLICATE_TRANSACTION or CONFLICT." }
        "429": { description: RATE_LIMITED. }

  # --- Champion Shop Phase 1 (docs/SHOP.md). Champion Points, installation-scoped. Admin routes: organization OWNER/ADMIN (403 SHOP_FORBIDDEN). ---
  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/categories:
    get:
      summary: Active shop categories with the number of active products in each.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200": { description: Categories., content: { application/json: { schema: { $ref: "#/components/schemas/ShopCategoryList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a category (organization OWNER/ADMIN). The slug is generated and unique per installation. Rate limited (30/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ShopCategoryRequest" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { type: object, properties: { category: { $ref: "#/components/schemas/AdminShopCategory" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: RATE_LIMITED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/admin/categories:
    get:
      summary: All categories including disabled ones (organization OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      responses:
        "200": { description: Categories., content: { application/json: { schema: { $ref: "#/components/schemas/AdminShopCategoryList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/categories/{categoryID}:
    put:
      summary: Update or disable a category (organization OWNER/ADMIN). Categories are never deleted.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: categoryID, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ShopCategoryRequest" } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { type: object, properties: { category: { $ref: "#/components/schemas/AdminShopCategory" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { description: NOT_FOUND or SHOP_CATEGORY_NOT_FOUND. }
        "429": { description: RATE_LIMITED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/products:
    get:
      summary: The active catalog (featured first, then sortOrder, name, id). Products of disabled categories are hidden. No DayZ link is needed to browse.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: category, in: query, required: false, schema: { type: string }, description: Category slug. }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 50 }, description: "Case-insensitive substring of name or description; LIKE wildcards are literal." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 25 }, description: "Maximum 100 - larger values are clamped; 0/negative/non-numeric is 400." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: The previous page nextCursor. }
      responses:
        "200": { description: One page., content: { application/json: { schema: { $ref: "#/components/schemas/ShopProductList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a product (organization OWNER/ADMIN). Only deliveryType MANUAL is accepted; unknown keys (imageUrl, installationId) are 400. Rate limited (30/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateShopProductRequest" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/AdminShopProductResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { description: NOT_FOUND or SHOP_CATEGORY_NOT_FOUND. }
        "429": { description: RATE_LIMITED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/products/{productID}:
    get:
      summary: One active product (public fields only). A disabled product is 404 SHOP_PRODUCT_NOT_FOUND.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: productID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The product., content: { application/json: { schema: { type: object, properties: { currency: { $ref: "#/components/schemas/EconomyCurrency" }, product: { $ref: "#/components/schemas/ShopProduct" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: NOT_FOUND or SHOP_PRODUCT_NOT_FOUND. }
    put:
      summary: Partial update, including price, stock, limit and isActive (organization OWNER/ADMIN). There is no deletion; disable with isActive false. Rate limited (30/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: productID, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateShopProductRequest" } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/AdminShopProductResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { description: NOT_FOUND, SHOP_PRODUCT_NOT_FOUND or SHOP_CATEGORY_NOT_FOUND. }
        "429": { description: RATE_LIMITED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/admin/products:
    get:
      summary: All products including inactive ones, with exact stock (organization OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 50 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 25 }, description: "Maximum 100 - larger values are clamped; 0/negative/non-numeric is 400." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: The previous page nextCursor. }
      responses:
        "200": { description: One page., content: { application/json: { schema: { $ref: "#/components/schemas/AdminShopProductList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/admin/products/{productID}:
    get:
      summary: One product with admin fields (organization OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: productID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The product., content: { application/json: { schema: { $ref: "#/components/schemas/AdminShopProductResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { description: NOT_FOUND or SHOP_PRODUCT_NOT_FOUND. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/purchases:
    post:
      summary: >-
        Buy one product with Champion Points, atomically: product lock, stock, purchase limit, the debit through the economy ledger (SHOP_PURCHASE, reference purchase:ID),
        the purchase and its price snapshot in ONE database transaction. Any failure (including INSUFFICIENT_FUNDS) leaves nothing behind. Needs a VERIFIED DayZ link. Rate limited (10/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ShopPurchaseRequest" } } } }
      responses:
        "201": { description: Purchased (status PENDING_FULFILLMENT)., content: { application/json: { schema: { $ref: "#/components/schemas/ShopPurchaseResponse" } } } }
        "200": { description: An idempotent replay of the same idempotencyKey - the original purchase, nothing charged (duplicate true)., content: { application/json: { schema: { $ref: "#/components/schemas/ShopPurchaseResponse" } } } }
        "400": { description: INVALID_QUANTITY or INVALID_REQUEST (bad key/body, unknown JSON key). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: NOT_FOUND or SHOP_PRODUCT_NOT_FOUND (also another tenant's product). }
        "409": { description: "INSUFFICIENT_FUNDS, OUT_OF_STOCK, PURCHASE_LIMIT_REACHED, SHOP_PRODUCT_DISABLED, DUPLICATE_PURCHASE (key reused with different data), PLAYER_IDENTITY_REQUIRED or CONFLICT (installation suspended / no DayZ server)." }
        "429": { description: RATE_LIMITED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/me/purchases:
    get:
      summary: The acting user's own purchases, newest first (keyset pagination). Needs a VERIFIED DayZ link.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, PAID, PENDING_FULFILLMENT, FULFILLED, CANCELLED, REFUNDED, FAILED] } }
        - { name: productId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 25 }, description: "Maximum 100 - larger values are clamped; 0/negative/non-numeric is 400." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: The previous page nextCursor. }
      responses:
        "200": { description: One page., content: { application/json: { schema: { $ref: "#/components/schemas/ShopPurchaseList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: PLAYER_IDENTITY_REQUIRED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/me/purchases/{purchaseID}:
    get:
      summary: One of the acting user's own purchases. Another player's purchase is 404 PURCHASE_NOT_FOUND.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: purchaseID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The purchase., content: { application/json: { schema: { type: object, properties: { currency: { $ref: "#/components/schemas/EconomyCurrency" }, purchase: { $ref: "#/components/schemas/ShopPurchase" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: NOT_FOUND or PURCHASE_NOT_FOUND. }
        "409": { description: PLAYER_IDENTITY_REQUIRED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/admin/purchases:
    get:
      summary: Every purchase of the installation, newest first, with the player and admin fields (organization OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, PAID, PENDING_FULFILLMENT, FULFILLED, CANCELLED, REFUNDED, FAILED] } }
        - { name: playerId, in: query, required: false, schema: { type: integer, format: int64 }, description: The economy accountId. }
        - { name: productId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 25 }, description: "Maximum 100 - larger values are clamped; 0/negative/non-numeric is 400." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: The previous page nextCursor. }
      responses:
        "200": { description: One page., content: { application/json: { schema: { $ref: "#/components/schemas/AdminShopPurchaseList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/admin/purchases/{purchaseID}:
    get:
      summary: One purchase with player, refund reason and actors (organization OWNER/ADMIN).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: purchaseID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The purchase., content: { application/json: { schema: { type: object, properties: { currency: { $ref: "#/components/schemas/EconomyCurrency" }, purchase: { $ref: "#/components/schemas/AdminShopPurchase" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { description: NOT_FOUND or PURCHASE_NOT_FOUND. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/purchases/{purchaseID}/fulfill:
    post:
      summary: Mark a PENDING_FULFILLMENT purchase FULFILLED (organization OWNER/ADMIN); records who and when. Audited (shop_purchase_fulfilled). Rate limited (30/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: purchaseID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Fulfilled., content: { application/json: { schema: { type: object, properties: { currency: { $ref: "#/components/schemas/EconomyCurrency" }, purchase: { $ref: "#/components/schemas/AdminShopPurchase" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { description: NOT_FOUND or PURCHASE_NOT_FOUND. }
        "409": { description: INVALID_PURCHASE_STATUS (already fulfilled, refunded, ...). }
        "429": { description: RATE_LIMITED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/shop/purchases/{purchaseID}/refund:
    post:
      summary: >-
        Refund a purchase (organization OWNER/ADMIN): a compensating SHOP_REFUND credit (the original debit is never edited), status REFUNDED, finite stock returned only if the
        purchase was not yet fulfilled. Once per purchase - a second or concurrent refund is 409. Audited (shop_purchase_refunded). Rate limited (30/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: purchaseID, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ShopRefundRequest" } } } }
      responses:
        "200": { description: Refunded; remainingBalance is the player's balance after the credit., content: { application/json: { schema: { $ref: "#/components/schemas/AdminShopPurchaseResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: code SHOP_FORBIDDEN. }
        "404": { description: NOT_FOUND or PURCHASE_NOT_FOUND. }
        "409": { description: INVALID_PURCHASE_STATUS. }
        "429": { description: RATE_LIMITED. }

  # --- Champion Billing Phase 1 (docs/BILLING.md). Stripe subscriptions; no plan/price approved yet. ---
  /api/saas/billing/plans:
    get:
      summary: The public plan catalog. Any synced user; no organization context; no Stripe price id ever returned.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
      responses:
        "200": { description: The catalog (empty items until a plan is approved and configured)., content: { application/json: { schema: { $ref: "#/components/schemas/BillingPlansResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/saas/player/servers:
    get:
      summary: >-
        Every installation the acting user has a legitimate, proven player association with (docs/PLAYER_API.md).
        Never organization-scoped - a Player is not an organization member. An unverified/never-observed user
        gets an empty list (200), not an error.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
      responses:
        "200": { description: The player's servers., content: { application/json: { schema: { $ref: "#/components/schemas/PlayerServersResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/saas/player/servers/{installationID}/stats:
    get:
      summary: >-
        The acting user's own stats on installationID, resolved server-side through their VERIFIED DayZ link -
        the browser can never submit a playerId or gamertag as authority.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { name: installationID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The player's stats on this installation., content: { application/json: { schema: { $ref: "#/components/schemas/PlayerStats" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Unknown installation, or no proven association (non-enumerating - both cases return 404)." }
        "409": { description: "PLAYER_IDENTITY_REQUIRED - no VERIFIED DayZ link for this installation's guild." }

  /api/saas/organizations/{organizationID}/billing/subscription:
    get:
      summary: This organization's subscription (any member).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      responses:
        "200": { description: The subscription., content: { application/json: { schema: { $ref: "#/components/schemas/BillingSubscriptionSummary" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/trial:
    get:
      summary: The organization's no-card trial state (any member). Read-only - never starts a trial.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      responses:
        "200": { description: The trial state., content: { application/json: { schema: { $ref: "#/components/schemas/TrialState" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/trial/start:
    post:
      summary: >-
        Start the acting user's one no-card 14-day trial on this organization (OWNER/ADMIN), or return the persisted state unchanged. Idempotent; never restarts or
        extends a trial, never overwrites a paid subscription, never contacts Stripe. planKey is recorded as the intended plan.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartTrialRequest" }
      responses:
        "200": { description: The persisted trial state., content: { application/json: { schema: { $ref: "#/components/schemas/TrialState" } } } }
        "400": { description: INVALID_PLAN (unknown or private plan) or INVALID_REQUEST., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/billing/checkout:
    post:
      summary: >-
        Create a Stripe Checkout Session (organization OWNER/ADMIN only). planKey/interval resolve the Stripe price server-side - never trust a submitted price.
        Never requests a Stripe trial (trial days are always 0 - Onboarding V2). Rate limited (20/min, shared with the other billing actions).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CheckoutRequest" } } } }
      responses:
        "200": { description: The hosted checkout URL., content: { application/json: { schema: { $ref: "#/components/schemas/CheckoutResponse" } } } }
        "400": { description: "INVALID_PLAN (unknown/private plan or not sold on that interval) or INVALID_REQUEST (unsafe returnPath)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Not this organization's OWNER/ADMIN (a faction role grants nothing)." }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: RATE_LIMITED. }
        "503": { description: BILLING_UNAVAILABLE - Stripe is not configured on this environment. }

  /api/saas/organizations/{organizationID}/billing/portal:
    post:
      summary: Create a Stripe Customer Portal session (organization OWNER/ADMIN only). Requires an existing Stripe customer. Rate limited (20/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PortalRequest" } } } }
      responses:
        "200": { description: The portal URL., content: { application/json: { schema: { $ref: "#/components/schemas/PortalResponse" } } } }
        "400": { description: INVALID_REQUEST (unsafe returnPath). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Not this organization's OWNER/ADMIN." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: NO_BILLING_CUSTOMER - this organization has not checked out yet. }
        "429": { description: RATE_LIMITED. }
        "503": { description: BILLING_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/billing/plan:
    post:
      summary: >-
        Change the organization's active plan/interval (organization OWNER/ADMIN only). Applies immediately with Stripe's default proration for both an upgrade and a downgrade
        (docs/BILLING.md "Upgrade, downgrade, cancel, reactivate"). Rate limited (20/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangePlanRequest" } } } }
      responses:
        "200": { description: The updated subscription., content: { application/json: { schema: { $ref: "#/components/schemas/BillingSubscriptionSummary" } } } }
        "400": { description: INVALID_PLAN. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Not this organization's OWNER/ADMIN." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: NO_ACTIVE_SUBSCRIPTION - checkout has never completed for this organization. }
        "429": { description: RATE_LIMITED. }
        "503": { description: BILLING_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/billing/cancel:
    post:
      summary: Schedule cancellation at the end of the current billing period (organization OWNER/ADMIN only). The subscription stays fully active until then. Rate limited (20/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      responses:
        "200": { description: The updated subscription (cancelAtPeriodEnd true)., content: { application/json: { schema: { $ref: "#/components/schemas/BillingSubscriptionSummary" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Not this organization's OWNER/ADMIN." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: NO_ACTIVE_SUBSCRIPTION. }
        "429": { description: RATE_LIMITED. }
        "503": { description: BILLING_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/billing/reactivate:
    post:
      summary: Undo a scheduled cancellation while the subscription is still active (organization OWNER/ADMIN only). Rate limited (20/min).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
      responses:
        "200": { description: The updated subscription (cancelAtPeriodEnd false)., content: { application/json: { schema: { $ref: "#/components/schemas/BillingSubscriptionSummary" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Not this organization's OWNER/ADMIN." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: NO_ACTIVE_SUBSCRIPTION. }
        "429": { description: RATE_LIMITED. }
        "503": { description: BILLING_UNAVAILABLE. }

  /api/saas/billing/webhook:
    post:
      summary: >-
        Stripe webhook endpoint. NOT behind the website's service-auth/acting-user chain - Stripe calls this directly and authenticates via the Stripe-Signature header
        (STRIPE_WEBHOOK_SECRET). Idempotent by Stripe event id (docs/BILLING.md "Webhook endpoint"). Unrecognized event types are acknowledged and ignored.
      security: []
      responses:
        "200": { description: Processed (or already processed, or an event type this backend ignores). }
        "400": { description: Invalid or missing Stripe-Signature. }
        "503": { description: STRIPE_WEBHOOK_SECRET is not configured. }

  # --- Client Admin Control Plane Phase 1 (docs/CLIENT_ADMIN.md) -----------------------------
  # Every route below requires a specific capability (its own minimum permissions.Level), not the
  # organization OWNER/ADMIN/MEMBER role used elsewhere in this file - see docs/CLIENT_ADMIN.md
  # "Permission model". Common error responses omitted per-route where identical: 401
  # Unauthorized, 403 ADMIN_FORBIDDEN (missing capability), 404 installation not found.

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/me:
    get:
      summary: >-
        The acting user's own resolved Champion BOT permission Level and exact capability set for this
        installation (Client Admin Control Plane Phase 1 Part 2, docs/CLIENT_ADMIN.md). NOT a Champion
        Platform Owner role and NOT an organization billing role - the website's Client Server Admin UI
        uses this single call to decide which controls to render. Requires no specific capability -
        an actor with no mapped Level still gets 403 ADMIN_FORBIDDEN, never a fabricated 200.
        capabilities is derived from the same fixed Level table every other route's own authorization
        check reads (permissions.CapabilitiesForLevel), sorted for stable, diff-friendly output.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      responses:
        "200": { description: "{ level: string, capabilities: string[], discordRoleIds?: string[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: ADMIN_FORBIDDEN - no Champion bot permission Level is mapped for this user on this installation. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "ADMIN_DISCORD_UNAVAILABLE - could not verify live Discord roles; never falls back to elevated or silently downgraded access." }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/permissions:
    get:
      summary: List this installation's Discord-role -> Champion-Level mappings (PERMISSIONS_VIEW).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      responses:
        "200": { description: "{ items: RolePermission[], actorLevel: string }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/permissions/{discordRoleID}:
    put:
      summary: >-
        Set (or update) one Discord role's Level (PERMISSIONS_MANAGE). Escalation-safe: the actor can only
        grant a Level at or below their own resolved Level, checked server-side - never trust the request body.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: discordRoleID, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [level], properties: { level: { type: string, enum: [OWNER, ADMINISTRATOR, MODERATOR, GATEKEEPER] } } } } } }
      responses:
        "200": { description: The saved mapping., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "ADMIN_FORBIDDEN or ADMIN_ESCALATION_DENIED (tried to grant above own Level)." }
        "429": { description: RATE_LIMITED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/permissions/{mappingID}:
    delete:
      summary: Remove a Discord-role mapping (PERMISSIONS_MANAGE, same escalation ceiling as PUT).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: mappingID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: "{ deleted: true }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "ADMIN_FORBIDDEN or ADMIN_ESCALATION_DENIED." }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/audit-log:
    get:
      summary: The tenant admin audit log, newest first (PERMISSIONS_VIEW).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      responses:
        "200": { description: "{ items: AuditEntry[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/warnings/{playerID}:
    get:
      summary: List a player's warnings, including cleared ones (WARNINGS_VIEW).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: playerID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "{ items: Warning[] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Issue a warning (WARNINGS_VIEW).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: playerID, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses:
        "201": { description: The created warning. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/warnings/{playerID}/{warningID}/clear:
    post:
      summary: >-
        Clear a warning (WARNINGS_CLEAR - a stricter floor than issuing). The row is never deleted: only
        cleared/clearedByUserId/clearedAt are set, preserving the audit trail.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: playerID, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: warningID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: The cleared warning. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Warning not found or already cleared." }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/bounties/{playerID}/reset:
    post:
      summary: Cancel every active bounty on a target player (BOUNTY_MANAGE). Claimed/expired history is untouched.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: playerID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "{ cancelled: integer }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/factions:
    get:
      summary: List every faction of this guild, active and dissolved, with a live member count (FACTION_MODERATE).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      responses:
        "200": { description: "{ items: FactionAdmin[] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/factions/{factionID}/dissolve:
    post:
      summary: Force-dissolve a faction (FACTION_DISSOLVE, HIGH RISK - typed confirmation required). All historical faction data is preserved.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: factionID, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string, enum: ["DISSOLVE"] } } } } } }
      responses:
        "200": { description: "{ dissolved: true }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: ADMIN_CONFIRMATION_REQUIRED. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/players/{playerID}/last-online:
    get:
      summary: A player's last observed connect/disconnect state on this installation's server (PLAYER_LAST_ONLINE_VIEW), backed by existing presence tracking.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: playerID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: LastOnline state. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "No observed activity for this player on this server." }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/economy/accounts:
    get:
      summary: Search Champion Points balances (ECONOMY_VIEW) - a capability-gated alias of the existing OWNER/ADMIN-only economy account search; same underlying query.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: q, in: query, schema: { type: string } }]
      responses:
        "200": { description: "{ items: EconomyAccountRow[] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/server/name:
    put:
      summary: Set the server's Champion-facing display name (SERVER_NAME_EDIT). Never renames the underlying Nitrado server.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 100 } } } } } }
      responses:
        "200": { description: "{ name: string }" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/feeds/{routeKey}/location:
    put:
      summary: Toggle whether a feed's embeds include location fields (FEED_LOCATION_MANAGE).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: routeKey, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [showLocation], properties: { showLocation: { type: boolean } } } } } }
      responses:
        "200": { description: "{ showLocation: boolean }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Unknown route key for this installation." }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/maintenance-mode:
    put:
      summary: Toggle maintenance mode (MAINTENANCE_MODE). Champion-side flag only; never touches the Nitrado server.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses:
        "200": { description: "{ enabled: boolean }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/server/restart:
    post:
      summary: >-
        Restart the DayZ server (SERVER_RESTART, MEDIUM RISK - typed confirmation "RESTART" required; rate
        limited 1/5min). Real Nitrado API call (POST .../gameservers/restart, verified against Nitrado's
        official SDK - see docs/CLIENT_ADMIN.md).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm], properties: { reason: { type: string }, confirm: { type: string, enum: ["RESTART"] } } } } } }
      responses:
        "200": { description: "{ restarting: true }" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: ADMIN_CONFIRMATION_REQUIRED. }
        "429": { description: RATE_LIMITED. }
        "503": { description: NITRADO_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/server/stop:
    post:
      summary: >-
        Stop the DayZ server (SERVER_STOP, HIGH RISK - typed confirmation "STOP" required; rate limited
        1/min). Real Nitrado API call (POST .../gameservers/stop).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm], properties: { reason: { type: string }, confirm: { type: string, enum: ["STOP"] } } } } } }
      responses:
        "200": { description: "{ stopping: true }" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: ADMIN_CONFIRMATION_REQUIRED. }
        "429": { description: RATE_LIMITED. }
        "503": { description: NITRADO_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/whitelist:
    get:
      summary: List active whitelist entries (WHITELIST_MANAGE). Champion-side metadata (reason/notes) - Nitrado's own API carries none.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      responses:
        "200": { description: "{ items: AccessEntry[] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Add to the whitelist (WHITELIST_MANAGE). Real Nitrado API call (POST .../games/whitelist); Champion's record is only saved once Nitrado confirms.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string }, reason: { type: string }, notes: { type: string }, expiresAt: { type: string, format: date-time, nullable: true } } } } } }
      responses:
        "201": { description: The created entry. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: NITRADO_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/whitelist/{identifier}:
    delete:
      summary: Remove from the whitelist (WHITELIST_MANAGE). Real Nitrado API call (DELETE .../games/whitelist).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: identifier, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ removed: true }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: NITRADO_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/banlist:
    get:
      summary: List active ban-list entries (BANLIST_MANAGE).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      responses:
        "200": { description: "{ items: AccessEntry[] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Add to the ban list (BANLIST_MANAGE). Real Nitrado API call (POST .../games/banlist).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string }, reason: { type: string }, notes: { type: string }, expiresAt: { type: string, format: date-time, nullable: true } } } } } }
      responses:
        "201": { description: The created entry. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: NITRADO_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/banlist/{identifier}:
    delete:
      summary: Remove from the ban list (BANLIST_MANAGE). Real Nitrado API call (DELETE .../games/banlist).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: identifier, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ removed: true }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: NITRADO_UNAVAILABLE. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/stats/player/{playerID}/reset-streak:
    post:
      summary: Reset a player's current kill streak to zero (PLAYER_STATS_RESET). Scoped to streak only this phase - see docs/CLIENT_ADMIN.md "Deferred" for kills/deaths/headshots.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: playerID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "{ reset: true }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/stats/reset-season:
    post:
      summary: >-
        End the active season and start a new one (SERVER_STATS_RESET, HIGH RISK - typed confirmation
        "RESET EVERYONE" required). Resets every season-scoped stat (kills/deaths/streaks/leaderboards)
        guild-wide while preserving full history - no kill/death record is ever deleted. Serves both the
        task's "resetEveryoneStat" and "resetServer" - see docs/CLIENT_ADMIN.md.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, confirm], properties: { name: { type: string }, confirm: { type: string, enum: ["RESET EVERYONE"] } } } } } }
      responses:
        "200": { description: "{ seasonId: integer, name: string }" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: ADMIN_CONFIRMATION_REQUIRED. }

  # --- Player Intelligence / Location History (Phase 3, docs/PLAYER_INTELLIGENCE.md) ----------
  # Not built on the economy account search - a dedicated player-directory/location-history query
  # surface. Location access is privileged: both location capabilities sit at Administrator, one
  # level above the plain directory listing.

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/players:
    get:
      summary: >-
        The authoritative player directory (PLAYER_DIRECTORY_VIEW) - real observed data only, never
        fabricated when unavailable. Never built on the economy account search.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: q, in: query, schema: { type: string } }
        - { name: online, in: query, schema: { type: boolean } }
        - { name: linked, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ items: PlayerDirectoryEntry[], nextCursor: string|null }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/players/online:
    get:
      summary: >-
        Currently-connected players plus each one's latest known location (PLAYER_LAST_LOCATION_VIEW -
        gated above the plain directory floor since the response includes location data). Never marks a
        disconnected player online. Writes an admin_audit_log entry (ONLINE_PLAYER_LOCATIONS_VIEWED) -
        location access is privileged.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      responses:
        "200": { description: "{ items: PlayerDirectoryEntry[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/players/{playerID}/locations/latest:
    get:
      summary: >-
        A single player's most recent observed location (PLAYER_LAST_LOCATION_VIEW), always derived at
        query time from player_location_events - never a second, potentially-stale "current location"
        column. Every location carries observedAt/ageSeconds/freshness (LIVE_RECENT<=60s / RECENT<=5min /
        STALE>5min) - ADM has no continuous GPS, so "live" is never implied unless it genuinely qualifies.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: playerID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "{ x, z, y, eventType, observedAt, ageSeconds, freshness }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No observed location for this player on this server. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/players/{playerID}/locations:
    get:
      summary: >-
        A player's location history, newest first (PLAYER_LOCATION_VIEW). Writes an admin_audit_log
        entry (PLAYER_LOCATION_HISTORY_VIEWED) - location access is privileged, never exposed through
        the public Player Hub.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: playerID, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: eventType, in: query, schema: { type: string, enum: [CONNECT, DISCONNECT, HIT, KILL, DEATH, RESPAWN, UNCONSCIOUS, OTHER_ADM] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ items: LocationEvent[], nextCursor: string|null }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones:
    get:
      summary: List every zone for this installation (ZONE_VIEW).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      responses:
        "200": { description: "{ items: Zone[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: >-
        Create a zone (ZONE_MANAGE; UAV/BASE_RADAR zoneType additionally requires UAV_MANAGE). radius
        must be > 0; zoneType is immutable after creation.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                zoneType: { type: string, enum: [SAFEZONE, PVP, RESTRICTED, EVENT, UAV, BASE_RADAR, CUSTOM] }
                centerX: { type: number }
                centerZ: { type: number }
                radius: { type: number }
                alertChannelId: { type: string, nullable: true }
                cooldownSeconds: { type: integer }
      responses:
        "201": { description: Zone, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones/{zoneID}:
    parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: zoneID, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: Get one zone (ZONE_VIEW).
      responses:
        "200": { description: Zone, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Zone not found. }
    put:
      summary: >-
        Partially update a zone (ZONE_MANAGE; additionally requires UAV_MANAGE if the zone's type is
        already UAV/BASE_RADAR). zoneType is never accepted here.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                centerX: { type: number }
                centerZ: { type: number }
                radius: { type: number }
                alertChannelId: { type: string, nullable: true }
                cooldownSeconds: { type: integer }
                enabled: { type: boolean }
      responses:
        "200": { description: Zone, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Zone not found. }
    delete:
      summary: >-
        Delete a zone, cascading its ignore/authorized/ban/presence/intrusion rows (ZONE_MANAGE;
        additionally requires UAV_MANAGE if the zone's type is UAV/BASE_RADAR).
      responses:
        "200": { description: "{ deleted: true }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Zone not found. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones/{zoneID}/ignore:
    parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: zoneID, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: List a zone's ignore-list entries (ZONE_VIEW).
      responses:
        "200": { description: "{ items: ZoneEntry[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: >-
        Add an ignore-list entry (ZONE_IGNORE_MANAGE, its own capability separate from ZONE_MANAGE). A
        matching entity is never tracked by the intrusion engine at all - no presence, no intrusion, no
        alert.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entryType: { type: string, enum: [PLAYER, FACTION, DISCORD_ROLE] }
                entryValue: { type: string }
      responses:
        "201": { description: ZoneEntry, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Zone not found. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones/ignore/{entryID}:
    delete:
      summary: Remove an ignore-list entry (ZONE_IGNORE_MANAGE).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: entryID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "{ deleted: true }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Entry not found. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones/{zoneID}/authorized:
    parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: zoneID, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: List a zone's authorized-entity entries (ZONE_VIEW).
      responses:
        "200": { description: "{ items: ZoneEntry[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: >-
        Add an authorized entity (ZONE_MANAGE). Meaningful only for UAV/BASE_RADAR zones - suppresses
        the alert only, an authorized entry's entry is still tracked/visible in history.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entryType: { type: string, enum: [PLAYER, FACTION] }
                entryValue: { type: string }
      responses:
        "201": { description: ZoneEntry, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Zone not found. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones/authorized/{entryID}:
    delete:
      summary: Remove an authorized entity (ZONE_MANAGE).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: entryID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "{ deleted: true }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Entry not found. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones/{zoneID}/bans:
    parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: zoneID, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: List a zone's bans, active and historical (ZONE_VIEW).
      responses:
        "200": { description: "{ items: ZoneBan[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: >-
        Ban a player from a zone (ZONE_MANAGE). Explicitly NOT a server ban - never calls the Nitrado
        banlist API; only flags a future entry (banned=true, a ZONE_BAN_VIOLATION event).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                playerId: { type: integer, format: int64 }
                reason: { type: string }
      responses:
        "201": { description: ZoneBan, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Zone not found. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones/bans/{banID}:
    delete:
      summary: Lift an active zone ban (ZONE_MANAGE). History is preserved, never deleted.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: banID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "{ lifted: true }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No active ban found. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/zones/{zoneID}/active-intruders:
    get:
      summary: >-
        Every player currently persisted as inside this zone (ZONE_VIEW). Each entry carries
        presenceStatus (PRESENT_RECENT or PRESENCE_UNCERTAIN, computed at read time from freshness -
        never a fabricated exit).
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: zoneID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: "{ items: ActiveIntruder[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Zone not found. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/intrusions/active:
    get:
      summary: Installation-wide open (ACTIVE or ACKNOWLEDGED) intrusions across every zone (ZONE_VIEW).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: zoneId, in: query, schema: { type: integer, format: int64 } }
        - { name: zoneType, in: query, schema: { type: string, enum: [SAFEZONE, PVP, RESTRICTED, EVENT, UAV, BASE_RADAR, CUSTOM] } }
        - { name: playerId, in: query, schema: { type: integer, format: int64 } }
        - { name: acknowledged, in: query, schema: { type: boolean } }
      responses:
        "200": { description: "{ items: ZoneIntrusion[] }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/intrusions/history:
    get:
      summary: Intrusion history, newest first, never deleted on exit (ZONE_VIEW).
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: zoneId, in: query, schema: { type: integer, format: int64 } }
        - { name: playerId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, ACKNOWLEDGED, EXITED] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ items: ZoneIntrusion[], nextCursor: string|null }", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/intrusions/{intrusionID}/acknowledge:
    post:
      summary: Acknowledge an ACTIVE intrusion (INTRUSION_ACK). Writes an admin_audit_log entry.
      parameters: [{ $ref: "#/components/parameters/ActingUser" }, { $ref: "#/components/parameters/organizationID" }, { $ref: "#/components/parameters/installationID" }, { name: intrusionID, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { description: ZoneIntrusion, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No ACTIVE intrusion found with that id. }

  /api/saas/organizations/{organizationID}/installations/{installationID}/admin/heatmap:
    get:
      summary: >-
        Aggregate PvP kill/death, player-activity, or zone-intrusion heatmap grid (HEATMAP_VIEW).
        Never returns a player id, gamertag, Discord id, or faction identity - the response is
        always an aggregate grid. No data is a valid 200 with empty cells, never a 404.
      parameters:
        - { $ref: "#/components/parameters/ActingUser" }
        - { $ref: "#/components/parameters/organizationID" }
        - { $ref: "#/components/parameters/installationID" }
        - { name: type, in: query, required: true, schema: { type: string, enum: [PVP_KILLS, PVP_DEATHS, PLAYER_ACTIVITY, ZONE_INTRUSIONS] } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "Default: 24h before to." }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Default: now." }
        - { name: resolution, in: query, schema: { type: integer, enum: [50, 100, 250, 500, 1000] }, description: "Default: 250." }
        - { name: zoneId, in: query, schema: { type: integer, format: int64 }, description: "Only honored for type=ZONE_INTRUSIONS; must belong to this installation." }
      responses:
        "200":
          description: Aggregated heatmap grid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  resolution: { type: integer }
                  totalEvents: { type: integer, format: int64 }
                  cells:
                    type: array
                    items:
                      type: object
                      properties:
                        cellX: { type: integer, format: int64 }
                        cellZ: { type: integer, format: int64 }
                        centerX: { type: number }
                        centerZ: { type: number }
                        count: { type: integer, format: int64 }
                        intensity: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: zoneId does not belong to this installation. }
