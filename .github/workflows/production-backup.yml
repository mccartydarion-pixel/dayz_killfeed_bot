name: production-backup

# Champion production PostgreSQL backup (docs/PRODUCTION_BACKUP.md).
#
# Lives ONLY on the branch ops/production-backup; Railway deploys main, so nothing here touches the bot
# or the DayZ server. A job runs only for an explicit trigger commit:
#   [backup:selftest]    - full rehearsal on disposable databases and a local S3-compatible store
#   [backup:production]  - the real export: an EMPTY commit by the owner carrying the marker, plus the
#                          owner's approval of the protected `production-backup` environment
# An ordinary code change can never start an export: it carries no marker, and a marked commit that
# changes files is refused.
# The repository is PUBLIC: logs print no data; the backup is stored only encrypted, only in the owner's
# private bucket, and is verified by downloading it back and restoring that copy.

on:
  push:
    branches: [ops/production-backup]

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  selftest:
    if: contains(github.event.head_commit.message, '[backup:selftest]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      source:
        image: postgres:18
        env: { POSTGRES_USER: champion, POSTGRES_PASSWORD: selftest, POSTGRES_DB: source_db }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U champion -d source_db" --health-interval 5s --health-timeout 5s --health-retries 20
      target:
        image: postgres:18
        env: { POSTGRES_USER: champion, POSTGRES_PASSWORD: selftest, POSTGRES_DB: restore_check }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U champion -d restore_check" --health-interval 5s --health-timeout 5s --health-retries 20
      retrieved:
        image: postgres:18
        env: { POSTGRES_USER: champion, POSTGRES_PASSWORD: selftest, POSTGRES_DB: retrieved_check }
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U champion -d retrieved_check" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SRC_URL: postgres://champion:selftest@127.0.0.1:5433/source_db
      TARGET_URL: postgres://champion:selftest@127.0.0.1:5432/restore_check
      PGSSLMODE: disable
      AWS_ACCESS_KEY_ID: selftestkey
      AWS_SECRET_ACCESS_KEY: selftestsecret123
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_BUCKET: champion-backup-selftest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Local S3-compatible store (Adobe S3Mock) standing in for the private bucket
        run: |
          docker run -d --name s3mock -p 9090:9090 adobe/s3mock:latest
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:9090/ && break; sleep 1; done
          aws s3 mb "s3://$S3_BUCKET" --endpoint-url "$S3_ENDPOINT"
          aws s3api head-bucket --bucket "$S3_BUCKET" --endpoint-url "$S3_ENDPOINT"
          echo "local S3-compatible store ready"
      - name: Build a production-shaped source (all registered migrations + sample rows)
        env:
          TEST_DATABASE_URL: postgres://champion:selftest@127.0.0.1:5433/source_db?sslmode=disable
          ALLOW_INTEGRATION_DB_TESTS: "true"
          REQUIRE_INTEGRATION_DB: "1"
        run: |
          go test -tags integration -count=1 -run TestPostgreSQLMigrationsApplyCleanly ./internal/database
          docker run --rm -i --network host -e SRC_URL postgres:18 sh -c 'psql "$SRC_URL" -X -q -v ON_ERROR_STOP=1' <<'SQL'
          INSERT INTO guilds(discord_guild_id) VALUES ('selftest-guild');
          INSERT INTO app_users(discord_user_id, discord_username) VALUES ('900000000000000001', 'selftest');
          CREATE TABLE selftest_types (id BIGSERIAL PRIMARY KEY, f DOUBLE PRECISION, ts TIMESTAMPTZ, b BYTEA, j JSONB, t TEXT, n NUMERIC(20,6));
          INSERT INTO selftest_types(f, ts, b, j, t, n)
          SELECT random() * 1e6, NOW() - (g || ' minutes')::interval, decode(md5(g::text), 'hex'), jsonb_build_object('g', g, 'x', 'ünïcødé'), repeat('Zz', g % 7), g * 1.000001
          FROM generate_series(1, 5000) g;
          SQL
      - name: Passphrase fingerprint check (match, mismatch, too short)
        run: |
          pass="$(openssl rand -base64 48)"
          echo "::add-mask::$pass"
          echo "BACKUP_PASS=$pass" >> "$GITHUB_ENV"
          BACKUP_PASS="$pass" BACKUP_PASSPHRASE_SHA256="$(printf '%s' "$pass" | sha256sum | cut -d' ' -f1)" bash ops/backup/check_passphrase.sh
          if BACKUP_PASS="$pass" BACKUP_PASSPHRASE_SHA256="$(printf 'other' | sha256sum | cut -d' ' -f1)" bash ops/backup/check_passphrase.sh; then echo "mismatch accepted"; exit 1; fi
          if BACKUP_PASS="short" BACKUP_PASSPHRASE_SHA256="$(printf 'short' | sha256sum | cut -d' ' -f1)" bash ops/backup/check_passphrase.sh; then echo "short passphrase accepted"; exit 1; fi
          echo "passphrase checks: OK"
      - name: Dump (snapshot-consistent) and verify by restore
        run: |
          mkdir -p work
          bash ops/backup/dump.sh work
          bash ops/backup/verify.sh work
      - name: Negative checks (a change is detected; non-local targets are refused)
        run: |
          docker run --rm --network host -e TARGET_URL postgres:18 sh -c 'psql "$TARGET_URL" -X -q -c "UPDATE selftest_types SET n = n + 1 WHERE id = 1"'
          docker run --rm --network host -e TARGET_URL -v "$PWD/work:/work" postgres:18 sh -c 'psql "$TARGET_URL" -X -q -f /work/inventory.sql -o /work/mutated.raw'
          LC_ALL=C sort work/mutated.raw > work/mutated.txt
          if diff -q work/source_inventory.txt work/mutated.txt > /dev/null; then echo "a changed row was not detected"; exit 1; fi
          echo "a changed row is detected: OK"
          if TARGET_URL=postgres://x:y@db.example.com:5432/prod bash ops/backup/verify.sh work; then echo "non-local target accepted"; exit 1; fi
          echo "non-local restore target refused: OK"
      - name: Seal, store, retrieve from the store and restore the retrieved copy
        run: |
          name="champion-db-selftest-run${GITHUB_RUN_ID}"
          bash ops/backup/seal.sh work out "$name"
          bash ops/backup/store.sh out "$name"
          TARGET_URL=postgres://champion:selftest@127.0.0.1:5434/retrieved_check bash ops/backup/retrieve_verify.sh "$name" "out/${name}.manifest.txt"
          if BACKUP_PASS=wrong-passphrase-wrong-passphrase-wrong TARGET_URL=postgres://champion:selftest@127.0.0.1:5434/retrieved_check bash ops/backup/retrieve_verify.sh "$name" "out/${name}.manifest.txt" 2>/dev/null; then echo "wrong passphrase accepted"; exit 1; fi
          echo "wrong passphrase refused on retrieval: OK"
          grep -E '^(dump_bytes|encrypted_bytes|result|tables|migrations)=' "out/${name}.manifest.txt"

  production:
    if: contains(github.event.head_commit.message, '[backup:production]') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-backup
    services:
      target:
        image: postgres:18
        env: { POSTGRES_USER: champion, POSTGRES_PASSWORD: restorecheck, POSTGRES_DB: restore_check }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U champion -d restore_check" --health-interval 5s --health-timeout 5s --health-retries 20
      retrieved:
        image: postgres:18
        env: { POSTGRES_USER: champion, POSTGRES_PASSWORD: restorecheck, POSTGRES_DB: retrieved_check }
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U champion -d retrieved_check" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TARGET_URL: postgres://champion:restorecheck@127.0.0.1:5432/restore_check
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Only an empty, deliberate trigger commit may start an export
        run: |
          if ! git diff --quiet HEAD^ HEAD; then echo "the [backup:production] commit changes files: refusing (use an empty trigger commit)"; exit 1; fi
          echo "trigger commit is empty: OK"
      - name: Required configuration is present (private destination is mandatory)
        env:
          SRC_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          missing=""
          [ -n "$SRC_URL" ] || missing="$missing PROD_DATABASE_URL"
          [ -n "$S3_ENDPOINT" ] || missing="$missing BACKUP_S3_ENDPOINT"
          [ -n "$S3_BUCKET" ] || missing="$missing BACKUP_S3_BUCKET"
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing="$missing BACKUP_S3_ACCESS_KEY_ID"
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing="$missing BACKUP_S3_SECRET_ACCESS_KEY"
          if [ -n "$missing" ]; then echo "missing environment secrets:$missing"; exit 1; fi
          echo "configuration present"
      - name: The passphrase secret matches the owner-retained fingerprint
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_PASSPHRASE_SHA256: ${{ vars.BACKUP_PASSPHRASE_SHA256 }}
        run: bash ops/backup/check_passphrase.sh
      - name: The private bucket is reachable
        run: |
          aws s3api head-bucket --bucket "$S3_BUCKET" --endpoint-url "$S3_ENDPOINT"
          echo "bucket reachable"
      - name: Dump production (read-only, snapshot-consistent)
        env:
          SRC_URL: ${{ secrets.PROD_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          mkdir -p work
          bash ops/backup/dump.sh work
      - name: Verify by restoring into a disposable PostgreSQL 18 (never production)
        run: bash ops/backup/verify.sh work
      - name: Encrypt, prove it opens, and write the manifest
        id: seal
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          name="champion-db-$(date -u +%Y%m%dT%H%M%SZ)-run${GITHUB_RUN_ID}"
          bash ops/backup/seal.sh work out "$name"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Store in the private bucket
        run: bash ops/backup/store.sh out "${{ steps.seal.outputs.name }}"
      - name: Retrieve from the bucket and restore the retrieved copy into a second disposable PostgreSQL 18
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          TARGET_URL: postgres://champion:restorecheck@127.0.0.1:5434/retrieved_check
        run: bash ops/backup/retrieve_verify.sh "${{ steps.seal.outputs.name }}" "out/${{ steps.seal.outputs.name }}.manifest.txt"
      - name: Manifest (no data)
        run: |
          cat "out/${{ steps.seal.outputs.name }}.manifest.txt"
          { echo '```'; cat "out/${{ steps.seal.outputs.name }}.manifest.txt"; echo "retrieved_from_bucket_and_restored=PASS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -rf out work
